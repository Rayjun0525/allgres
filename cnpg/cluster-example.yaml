# Example CNPG (CloudNativePG) wiring for the extension image built from
# cnpg/Dockerfile.
#
# PREREQUISITE: the CNPG operator itself must already be installed on the
# target cluster -- `Cluster`/`Database` are CRDs it registers, so without
# it `kubectl apply` on this file fails with "no matches for kind Cluster
# in version postgresql.cnpg.io/v1 -- ensure CRDs are installed first"
# (confirmed live, this is the first thing anyone applying this file for
# the first time will hit). Install it once per cluster, e.g.:
#
#   helm repo add cnpg https://cloudnative-pg.github.io/charts
#   helm upgrade --install cnpg --namespace cnpg-system --create-namespace cnpg/cloudnative-pg
#
# then confirm with `kubectl get pods -n cnpg-system` before applying this
# file. See https://cloudnative-pg.io for other install methods (a plain
# kubectl manifest, the krew plugin).
#
# Two separate CRs below, two separate concerns:
#
#   Cluster.spec.postgresql.extensions   mounts the image's files at
#                                         /extensions/allgres so PostgreSQL
#                                         can find allgres.so/.control/.sql
#                                         -- this alone does NOT run
#                                         CREATE EXTENSION anywhere.
#   Cluster.spec.postgresql.
#     shared_preload_libraries           still required and separate from
#                                         the extensions mount above --
#                                         allgres registers two background
#                                         workers from _PG_init at preload
#                                         time (README, "Extension
#                                         installation"), which the image-
#                                         volume mechanism does not provide
#                                         on its own. Adding/changing this
#                                         list triggers CNPG's own rolling
#                                         restart automatically.
#   Database.spec.extensions             the actual `CREATE EXTENSION
#                                         allgres;` (and pgcrypto, optional
#                                         but recommended -- README,
#                                         "Secrets at rest"), run once CNPG
#                                         reconciles this Database CR
#                                         against the target database.
#
# Requires PostgreSQL 18+ and Kubernetes 1.33+ (with the ImageVolume
# feature gate enabled manually on 1.33-1.34; default-on from 1.35, AND a
# containerd 2.1+ or CRI-O 1.31+ runtime specifically -- confirmed live,
# Rancher Desktop's dockerd (moby) engine does not support ImageVolume at
# all and fails the mount with "invalid volume specification"), plus the
# CNPG operator itself already installed -- see below. The image
# reference below (ghcr.io/rayjun0525/allgres-cnpg-ext) is published by
# .github/workflows/publish-image.yml, same as the plain-Docker image:
# `:main` (used below) on every push to main, plus a real version tag and
# `:latest` once one is actually pushed. Point it at your own build
# instead if you're testing a local change before either exists.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: allgres
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie

  postgresql:
    extensions:
      - name: allgres
        image:
          reference: ghcr.io/rayjun0525/allgres-cnpg-ext:main
    shared_preload_libraries:
      - allgres

  storage:
    size: 1Gi

  bootstrap:
    initdb:
      database: app
      owner: app
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: allgres-app
spec:
  name: app
  owner: app
  cluster:
    name: allgres
  extensions:
    - name: pgcrypto
    - name: allgres
      version: "0.1.0"
