name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # cargo-pgrx version must track the `pgrx` dependency pin in Cargo.toml.
  PGRX_VERSION: "0.19.2"

jobs:
  # The real target: fn_selftest, tests/smoke.sql, and tests/e2e_mock.sql,
  # natively installed and run against every PostgreSQL major version this
  # extension claims to support -- not just the one the Dockerfile happens to
  # build (see the docker-smoke job below for that path specifically, and
  # KNOWN_ISSUES.md, "Docker image path", for why the two are not redundant:
  # this job proves the extension itself works on 16/17/18; docker-smoke
  # proves the shipped container image does).
  native-matrix:
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 17, 18]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev pkg-config curl ca-certificates

      - name: Install PostgreSQL ${{ matrix.pg }} (PGDG)
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-common
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y --no-install-recommends \
            postgresql-${{ matrix.pg }} postgresql-server-dev-${{ matrix.pg }}
          echo "PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config" >> "$GITHUB_ENV"
          # GitHub-hosted runner images preinstall PostgreSQL 16 with a
          # running 16/main cluster already created, but set
          # create_main_cluster = false in postgresql-common's config --
          # confirmed live: 16 has /etc/postgresql/16/main/postgresql.conf
          # already, 17 and 18 do not, so the next step's `tee` into it
          # fails with "No such file or directory". Create the cluster
          # ourselves whenever the config doesn't already exist; a no-op
          # for 16.
          if [ ! -f "/etc/postgresql/${{ matrix.pg }}/main/postgresql.conf" ]; then
            sudo pg_createcluster ${{ matrix.pg }} main
          fi

      - name: Cache cargo registry, cargo-pgrx binary, and target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-pgrx
            target
          key: pg${{ matrix.pg }}-cargo-pgrx${{ env.PGRX_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Install cargo-pgrx (skip if the cache already has it)
        run: |
          if [ ! -x "$HOME/.cargo/bin/cargo-pgrx" ]; then
            cargo install --locked cargo-pgrx --version "$PGRX_VERSION"
          fi

      - name: cargo pgrx init
        run: cargo pgrx init --pg${{ matrix.pg }}="$PG_CONFIG"

      - name: Rust unit tests (request parsing, auth/rate-limit, parse-tree reader)
        run: cargo test --no-default-features --features "pg${{ matrix.pg }},pg_test" --lib

      - name: cargo pgrx install
        run: |
          # The GitHub-hosted runner's default user is not root and the PGDG
          # packages install pkglibdir/extension-dir owned by root; cargo pgrx
          # install writes the compiled .so, control file, and SQL scripts
          # there directly (no sudo of its own), so it fails with EACCES
          # otherwise -- confirmed live the first time this workflow actually
          # ran on GitHub's infrastructure (see KNOWN_ISSUES.md, item 3).
          # chown once, up front, rather than wrapping the cargo invocation in
          # sudo, which would need to preserve rustup's PATH/HOME correctly.
          sudo chown "$(id -un)" "$("$PG_CONFIG" --pkglibdir)" "$("$PG_CONFIG" --sharedir)/extension"
          cargo pgrx install --no-default-features --features pg${{ matrix.pg }} --pg-config "$PG_CONFIG"
          # cargo-pgrx only writes the current crate version's script
          # (allgres--<version>.sql); the frozen base snapshot(s) and
          # generated upgrade script(s) are ours to place too, same as the
          # Dockerfile does -- see sql/allgres--0.2.0.sql's own header.
          cp -f sql/allgres--*.sql "$("$PG_CONFIG" --sharedir)/extension/"

      - name: Configure and restart the cluster
        run: |
          PGCONF="/etc/postgresql/${{ matrix.pg }}/main/postgresql.conf"
          PGENV="/etc/postgresql/${{ matrix.pg }}/main/environment"
          echo "shared_preload_libraries = 'allgres'" | sudo tee -a "$PGCONF"
          echo "ALLGRES_ENABLE_MOCK = '1'" | sudo tee -a "$PGENV"
          sudo pg_ctlcluster ${{ matrix.pg }} main restart
          # The runner image's preinstalled default PostgreSQL service
          # already holds port 5432 in some matrix legs, so a cluster this
          # workflow just created (previous step's pg_createcluster) can
          # land on a different port -- confirmed live: 18/main came up on
          # 5433. Read back whatever port this exact cluster actually uses
          # instead of assuming 5432, and pass it explicitly everywhere
          # from here on (sudo does not reliably propagate env vars set via
          # GITHUB_ENV into the child, so this is threaded through as a
          # literal -p argument, not relied on as inherited environment).
          PGPORT="$(pg_lsclusters -h | awk -v v="${{ matrix.pg }}" '$1==v && $2=="main"{print $3}')"
          echo "PGPORT=$PGPORT" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do sudo -u postgres pg_isready -q -p "$PGPORT" && break; sleep 1; done

      - name: CREATE EXTENSION and run fn_selftest / smoke / e2e
        run: |
          sudo -u postgres psql -p "$PGPORT" -d postgres -v ON_ERROR_STOP=1 -c "CREATE EXTENSION allgres;"
          # pgcrypto is optional for allgres itself (README, "Runtime
          # requirements") but the accounts system hard-requires it --
          # fn_create_user raises if it's missing -- and the real-admin-
          # account check below needs it to run at all.
          sudo -u postgres psql -p "$PGPORT" -d postgres -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          # fn_selftest itself, on a fresh install -- this step's own name has
          # long claimed to run it, but only tests/smoke.sql and
          # tests/e2e_mock.sql below actually did; a real regression here
          # would never have failed the build. `failed` must be exactly 0,
          # not just "the call didn't error".
          check_selftest() {
            result=$(sudo -u postgres psql -p "$PGPORT" -d postgres -v ON_ERROR_STOP=1 -tAc \
              "SELECT allgres_public.fn_selftest()")
            failed=$(jq -r '.failed' <<<"$result")
            echo "fn_selftest: $(jq -r '.passed' <<<"$result") passed, $failed failed"
            if [[ "$failed" != "0" ]]; then
              jq '[.cases[] | select(.ok == false)]' <<<"$result"
              return 1
            fi
          }
          check_selftest
          # Idempotent across reruns on the same database -- every fixture
          # either hard-deletes itself or is hidden (never a fresh-install
          # assumption; see README, "Tests").
          check_selftest
          check_selftest
          # Also safe with a real admin account in place -- this is the
          # scenario roadmap item 9 named directly (a selftest that used to
          # fail the moment any account existed), and account-creation-then-
          # use end to end over real HTTP is what scripts/bootstrap.sh proves
          # in the docker-smoke job below.
          sudo -u postgres psql -p "$PGPORT" -d postgres -v ON_ERROR_STOP=1 -tAc \
            "SELECT allgres_public.fn_create_user('ci_selftest_admin', 'ci-selftest-check-pw', 'admin');" >/dev/null
          check_selftest
          sudo -u postgres psql -p "$PGPORT" -d postgres -tAc \
            "DELETE FROM allgres_private.web_sessions WHERE user_id IN (SELECT user_id FROM allgres_private.users WHERE username = 'ci_selftest_admin'); DELETE FROM allgres_private.users WHERE username = 'ci_selftest_admin';" >/dev/null
          sudo -u postgres psql -p "$PGPORT" -d postgres -v ON_ERROR_STOP=1 -f tests/smoke.sql
          sudo -u postgres psql -p "$PGPORT" -d postgres -v ON_ERROR_STOP=1 -f tests/e2e_mock.sql

      - name: PostgreSQL log on failure
        if: failure()
        run: sudo tail -n 300 /var/log/postgresql/postgresql-${{ matrix.pg }}-main.log || true

  # The container path is a separate concern from native install: it exercises
  # the Dockerfile (currently pinned to postgres:17-bookworm) and
  # docker-compose.yml exactly as an operator following the README would,
  # including the loopback-only port binding.
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose build + smoke
        run: ./scripts/smoke.sh
      - name: install flow (first admin + one real agent task to completion)
        run: ./scripts/bootstrap.sh
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color allgres | tail -300 || true

  # roadmap item 9 named "재시작, 재시도" (restart, retry) directly as
  # scenarios CI needs, alongside a clean install -- this is that scenario.
  # scripts/fault_injection_drill.sh needs a real, disposable PostgreSQL
  # instance it can genuinely SIGKILL and let crash-recover on its own (that
  # is the entire point of the drill, see the script's own header) -- a
  # GitHub-hosted runner is exactly that, and is thrown away after the job
  # regardless of outcome, so there is no "real traffic" here for the drill's
  # own warning to worry about. Setup mirrors native-matrix's pg16 leg (same
  # PGDG package layout the drill's PG_BIN/PGCONF/LOGFILE defaults assume) --
  # kept separate rather than folded into that job's matrix, since the drill
  # kills and restarts the whole instance mid-job on purpose, which the other
  # native-matrix legs (16/17/18 running fn_selftest/smoke/e2e) must not do.
  fault-injection-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev pkg-config curl ca-certificates

      - name: Install PostgreSQL 16 (PGDG)
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-common
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-server-dev-16

      - name: Cache cargo registry, cargo-pgrx binary, and target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-pgrx
            target
          key: pg16-cargo-pgrx${{ env.PGRX_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Install cargo-pgrx (skip if the cache already has it)
        run: |
          if [ ! -x "$HOME/.cargo/bin/cargo-pgrx" ]; then
            cargo install --locked cargo-pgrx --version "$PGRX_VERSION"
          fi

      - name: cargo pgrx init
        run: cargo pgrx init --pg16=/usr/lib/postgresql/16/bin/pg_config

      - name: cargo pgrx install
        run: |
          sudo chown "$(id -un)" /usr/lib/postgresql/16/lib /usr/share/postgresql/16/extension
          cargo pgrx install --no-default-features --features pg16 --pg-config /usr/lib/postgresql/16/bin/pg_config
          cp -f sql/allgres--*.sql /usr/share/postgresql/16/extension/

      - name: Configure and restart the cluster
        run: |
          echo "shared_preload_libraries = 'allgres'" | sudo tee -a /etc/postgresql/16/main/postgresql.conf
          echo "ALLGRES_ENABLE_MOCK = '1'" | sudo tee -a /etc/postgresql/16/main/environment
          sudo pg_ctlcluster 16 main restart
          for _ in $(seq 1 30); do sudo -u postgres pg_isready -q && break; sleep 1; done
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE EXTENSION allgres;"

      - name: fault injection drill (real SIGKILL mid-call, real crash recovery, real automatic retry)
        run: ./scripts/fault_injection_drill.sh

      - name: PostgreSQL log on failure
        if: failure()
        run: sudo tail -n 300 /var/log/postgresql/postgresql-16-main.log || true
