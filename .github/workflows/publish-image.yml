name: Publish image

# Deliberately separate from ci.yml (which only ever tests, never publishes
# anything externally): pushing to GHCR is a visible, one-way action
# (README, "the version number tracks an actual release, not every
# development milestone"), so it fires on an actual version tag, not every
# commit to main the way ci.yml's own native-matrix/docker-smoke jobs do.
# workflow_dispatch exists for a manual/retroactive publish (e.g. the first
# run, or re-publishing an existing tag after a Dockerfile-only change)
# without needing a new tag just to trigger it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# GITHUB_TOKEN is enough to push to this repo's own GHCR packages -- no
# extra secret to configure. packages: write is the one permission this
# needs beyond the default read.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Docker/OCI image names must be all-lowercase, but github.repository
      # preserves this repo's real casing (Rayjun0525/allgres) -- pushing
      # ghcr.io/Rayjun0525/allgres would just fail outright, so this is
      # computed once here rather than assumed.
      - name: Determine image name and tag(s) from the git ref
        id: tag
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            REF="${GITHUB_REF#refs/tags/}"
            echo "tags=${IMAGE}:${REF},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            REF="${GITHUB_REF#refs/heads/}"
            echo "tags=${IMAGE}:${REF}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # arm64 runs under QEMU emulation on this amd64 runner -- the Rust/pgrx
      # compile is real CPU work, so this leg of the build takes noticeably
      # longer than the native amd64 leg, not a sign anything is stuck.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tag.outputs.tags }}
