<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Allgres Control Plane</title><style nonce="__CSP_NONCE__">
:root{--bg:#0b0d10;--panel:#11151a;--panel2:#161b22;--line:#262d36;--text:#e6edf3;--muted:#8b949e;--accent:#7ee787;--accent2:#58a6ff;--bad:#ff7b72;--warn:#d29922}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;background:#0d1014}.brand{font-size:22px;font-weight:760;letter-spacing:-.5px}.tag{color:var(--muted);font-size:12px;margin:2px 0 28px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:8px;margin:2px 0;cursor:pointer}.nav button.active,.nav button:hover{background:var(--panel2);color:var(--text)}.main{padding:28px 32px;max-width:1500px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.title{font-size:24px;font-weight:700}.pill{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}.cards{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:12px;margin:16px 0 24px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}.card{padding:16px}.metric{font-size:28px;font-weight:720}.label{color:var(--muted);font-size:12px}.panel{padding:16px;margin-bottom:16px}.panel h3{margin:0 0 14px;font-size:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.spacer{flex:1}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#08110a;font-weight:650}.btn.danger{color:var(--bad)}.btn.small{padding:3px 8px;font-size:11px}.input,.textarea,.select{width:100%;background:#0d1117;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 10px}.textarea{min-height:110px;resize:vertical}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.status{font-size:11px;border:1px solid var(--line);padding:3px 7px;border-radius:999px}.s-completed,.s-approved{color:var(--accent)}.s-failed,.s-rejected,.s-cancelled{color:var(--bad)}.s-running,.s-queued,.s-open{color:var(--accent2)}.s-waiting_human,.s-pending{color:var(--warn)}.s-stale{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.muted{color:var(--muted)}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:24px}.dialog{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}.toast{position:fixed;right:24px;bottom:24px;background:var(--panel2);border:1px solid var(--line);padding:10px 14px;border-radius:9px;display:none}.log{max-width:680px;white-space:pre-wrap;word-break:break-word}.hero{padding:18px 0 4px}.hero h2{font-size:30px;margin:0}.hero p{color:var(--muted);margin:4px 0}.banner{border:1px solid var(--warn);color:var(--warn);border-radius:9px;padding:10px 12px;margin-bottom:14px;font-size:13px}.msg{padding:8px 0;border-bottom:1px solid var(--line)}.msg-body{margin-top:4px;white-space:pre-wrap;word-break:break-word}.listrow{padding:10px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border-bottom:0}@media(max-width:900px){.app{grid-template-columns:1fr}.side{height:auto;position:relative;border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap}.main{padding:20px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Allgres</div><div class="tag">Postgres Is All You Need.</div><nav class="nav" id="nav"></nav></aside><main class="main"><div class="top"><div><div class="title" id="pageTitle">Overview</div><div class="muted" id="pageSub">PostgreSQL-native agent control plane</div></div><div class="pill"><span class="dot"></span><span id="health">connecting</span></div></div><div id="view"></div></main></div><div id="modal" class="modal hidden"></div><div id="toast" class="toast"></div>
<script nonce="__CSP_NONCE__">
const state={page:'Overview',agents:[],projects:[],sessions:[],approvals:[],proposals:[],proposalAgentFilter:null,tasks:[],logs:[],settings:null,overview:null};
const pages=['Overview','Agents','Projects','Run','Sessions','Approvals','Proposals','Tasks','Logs','Settings'];
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(s){const t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}

// The dashboard token, when one is configured, lives in sessionStorage only.
// Nothing persists it to disk and it is never placed in the page URL.
const tok=()=>sessionStorage.getItem('allgres_token')||'';
function setTok(v){v?sessionStorage.setItem('allgres_token',v):sessionStorage.removeItem('allgres_token')}
function askToken(){const v=prompt('Dashboard token (ALLGRES_DASHBOARD_TOKEN)');if(v!==null){setTok(v.trim());location.reload()}}

// X-Allgres-Client cannot be set by a cross-site form or <img>, so requiring it
// forces a preflight that the server never approves.
async function api(path,opt={}){
  opt.headers={...(opt.headers||{}),'Content-Type':'application/json','X-Allgres-Client':'dashboard'};
  if(tok())opt.headers['Authorization']='Bearer '+tok();
  const r=await fetch(path,opt);
  if(r.status===401){askToken();throw new Error('unauthorized')}
  const j=await r.json();
  if(j.ok===false)throw new Error(j.error||'request failed');
  return j;
}
// Generic dashboard_rpc passthrough: every action added since agents/run/
// tasks/logs/settings (projects.*, approvals.*, sessions.*, permissions.*,
// allowlist.*, policy.history) reaches allgres.dashboard_rpc through this one
// route instead of a named one, so a new SQL-side action never needs a Rust
// or dashboard rebuild to become reachable -- only this file changes.
const rpc=(action,body={})=>api('/api/v1/rpc',{method:'POST',body:JSON.stringify({action,...body})});

function nav(){const n=$('#nav');n.innerHTML=pages.map(p=>`<button class="${state.page===p?'active':''}" data-p="${p}">${p}</button>`).join('');n.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.page=b.dataset.p;nav();loadPage()})}
function status(s){return `<span class="status s-${esc(s)}">${esc(s)}</span>`}
function fmtContent(c){return typeof c==='string'?c:JSON.stringify(c)}
async function loadPage(){ $('#pageTitle').textContent=state.page; try{
  if(state.page==='Overview')await overview();
  if(state.page==='Agents')await agents();
  if(state.page==='Projects')await projectsPage();
  if(state.page==='Run')await runView();
  if(state.page==='Sessions')await sessionsPage();
  if(state.page==='Approvals')await approvalsPage();
  if(state.page==='Proposals')await proposalsPage();
  if(state.page==='Tasks')await tasks();
  if(state.page==='Logs')await logs();
  if(state.page==='Settings')await settings();
}catch(e){toast(e.message)} }

async function overview(){const d=await api('/api/v1/status');state.overview=d;$('#view').innerHTML=`${secretBanner(d.secret_storage)}<div class="hero"><h2>One database. One extension.</h2><p>Agents, state, policy, queue, audit, native I/O and dashboard inside PostgreSQL.</p></div><div class="cards">${[['Agents',d.agents],['Active',d.active_agents],['Running',d.running_tasks],['Outbound',d.queued_outbound],['SQL',d.queued_sql],['Approvals',d.pending_approvals],['Failed',d.failed_tasks]].map(x=>`<div class="card"><div class="metric">${x[1]}</div><div class="label">${x[0]}</div></div>`).join('')}</div><div class="grid2"><div class="panel"><h3>Workers</h3>${(d.workers||[]).map(w=>`<div class="row"><span class="dot"></span><span>${esc(w.name)}</span><span class="spacer"></span><span class="mono muted">PID ${esc(w.pid)}</span></div>`).join('')||'<div class="muted">No workers reported</div>'}</div><div class="panel"><h3>Recent tasks</h3>${taskRows(d.recent_tasks||[],true)}</div></div>`}
function secretBanner(mode){if(!mode||mode==='encrypted')return '';const why=mode==='plaintext_no_pgcrypto'?'pgcrypto is not installed':'allgres.secret_key is not set';return `<div class="banner">Provider API keys are stored in plaintext because ${esc(why)}. See README, "Secrets at rest".</div>`}
function taskRows(a,compact=false){if(!a.length)return '<div class="muted">No tasks yet.</div>';return `<table class="table"><thead><tr><th>Agent</th><th>Status</th><th>Goal</th>${compact?'':'<th>Steps</th><th>Updated</th>'}</tr></thead><tbody>${a.map(t=>`<tr><td>${esc(t.agent)}</td><td>${status(t.status)}</td><td>${esc(t.goal||'')}</td>${compact?'':`<td>${esc(t.step_count)}</td><td class="mono muted">${esc(t.updated_at||'')}</td>`}</tr>`).join('')}</tbody></table>`}

// --- Agents: CRUD, plus permissions and policy history in the edit modal ---
async function agents(){const d=await api('/api/v1/agents');state.agents=d.agents||[];$('#view').innerHTML=`<div class="row" style="margin-bottom:14px"><button class="btn primary" id="newAgent">New agent</button><span class="spacer"></span><span class="muted">${state.agents.length} agents</span></div><div class="panel"><table class="table"><thead><tr><th>Name</th><th>Model</th><th>Provider</th><th>Status</th><th>Permissions</th><th></th></tr></thead><tbody>${state.agents.map(a=>`<tr><td><b>${esc(a.name)}</b><div class="mono muted">${esc(a.agent_id).slice(0,12)}…</div></td><td>${esc(a.llm_config?.model||'—')}</td><td>${esc(a.llm_config?.provider||'—')}</td><td>${a.is_active?status('running'):status('disabled')}</td><td>${(a.permissions||[]).length}</td><td><button class="btn editAgent" data-id="${esc(a.agent_id)}">Edit</button></td></tr>`).join('')}</tbody></table></div>`;$('#newAgent').onclick=()=>agentModal();document.querySelectorAll('.editAgent').forEach(b=>b.onclick=()=>agentModal(state.agents.find(a=>a.agent_id===b.dataset.id)))}
async function agentModal(a){
  const isNew=!a;
  const opts=isNew?null:await rpc('permissions.options').catch(()=>null);
  $('#modal').classList.remove('hidden');
  $('#modal').innerHTML=`<div class="dialog"><div class="row"><h3>${isNew?'Create agent':'Edit agent'}</h3><span class="spacer"></span><button class="btn" id="closeM">Close</button></div>
<div class="field"><label>Name</label><input class="input" id="aName" value="${esc(a?.name||'')}"></div>
<div class="field"><label>System prompt</label><textarea class="textarea" id="aPrompt">${esc(a?.system_prompt||'')}</textarea></div>
${isNew?'':`<div class="grid2"><div class="field"><label>Provider</label><input class="input" id="aProvider" value="${esc(a?.llm_config?.provider||'')}"></div><div class="field"><label>Model</label><input class="input" id="aModel" value="${esc(a?.llm_config?.model||'')}"></div></div>
<div class="muted" style="font-size:12px;margin:-4px 0 8px">The endpoint URL comes from the provider in Settings; an agent cannot override it.</div>
<div class="grid2"><div class="field"><label>Max steps</label><input type="number" class="input" id="aSteps" value="${esc(a.max_steps||20)}"></div><div class="field"><label>Max retries</label><input type="number" class="input" id="aRetries" value="${esc(a.max_retries||2)}"></div></div>
<div class="grid2"><div class="field"><label>Max concurrent tasks</label><input type="number" class="input" id="aConcurrent" value="${esc(a.max_concurrent_tasks||4)}"></div><div class="field"><label>Max turn seconds (blank = uncapped)</label><input type="number" class="input" id="aTurnSecs" value="${a.max_turn_seconds??''}"></div></div>
<div class="grid2"><div class="field"><label>Max delegation depth</label><input type="number" class="input" id="aDelegDepth" value="${esc(a.max_delegation_depth??5)}"></div><div class="field"><label>Max session tasks</label><input type="number" class="input" id="aSessTasks" value="${esc(a.max_session_tasks??100)}"></div></div>
<div class="field"><label><input type="checkbox" id="aActive" ${a.is_active?'checked':''}> Active</label></div>
<div class="field"><div class="row"><label style="margin:0">Permissions</label><span class="spacer"></span><span class="muted mono" style="font-size:11px">v${esc(a.generation||1)}</span><button class="btn small" id="viewProposals">Proposals</button><button class="btn small" id="viewHistory">History</button></div>
<div id="permList">${(a.permissions||[]).map(p=>`<div class="row" style="padding:4px 0"><span class="mono" style="font-size:12px">${esc(p.type)}: ${esc(p.ref)}</span><span class="spacer"></span><button class="btn danger small revokeP" data-type="${esc(p.type)}" data-ref="${esc(p.ref)}">Revoke</button></div>`).join('')||'<div class="muted" style="font-size:12px">No permissions granted.</div>'}</div>
<div class="row" style="margin-top:8px"><select class="select" id="permType" style="max-width:130px"><option value="view">view</option><option value="tool">tool</option><option value="agent">agent</option><option value="http_host">http_host</option></select><input class="input" id="permRef" placeholder="resource ref" list="permRefOptions"><datalist id="permRefOptions"></datalist><button class="btn" id="grantP">Grant</button></div>
</div>`}
<button class="btn primary" id="saveA">Save</button></div>`;
  $('#closeM').onclick=closeModal;
  if(!isNew&&opts){
    const fillRefOptions=()=>{const t=$('#permType').value;const list=t==='view'?opts.views:t==='agent'?opts.agents:t==='tool'?opts.tools:[];$('#permRefOptions').innerHTML=(list||[]).map(v=>`<option value="${esc(v)}">`).join('')};
    $('#permType').onchange=fillRefOptions; fillRefOptions();
    $('#grantP').onclick=async()=>{try{await rpc('permissions.grant',{agent_id:a.agent_id,type:$('#permType').value,ref:$('#permRef').value});closeModal();toast('Granted');agents()}catch(e){toast(e.message)}};
    document.querySelectorAll('.revokeP').forEach(b=>b.onclick=async()=>{try{await rpc('permissions.revoke',{agent_id:a.agent_id,type:b.dataset.type,ref:b.dataset.ref});closeModal();toast('Revoked');agents()}catch(e){toast(e.message)}});
    $('#viewHistory').onclick=async()=>{try{const h=await rpc('policy.history',{agent_id:a.agent_id});historyModal(a.agent_id,h.history||[])}catch(e){toast(e.message)}};
    $('#viewProposals').onclick=()=>{state.proposalAgentFilter=a.agent_id;state.page='Proposals';closeModal();nav();loadPage()};
  }
  $('#saveA').onclick=async()=>{try{if(isNew){await api('/api/v1/agents',{method:'POST',body:JSON.stringify({name:$('#aName').value,system_prompt:$('#aPrompt').value})})}else{await api('/api/v1/agents/'+encodeURIComponent(a.agent_id),{method:'PATCH',body:JSON.stringify({system_prompt:$('#aPrompt').value,is_active:$('#aActive').checked,max_steps:+$('#aSteps').value,max_retries:+$('#aRetries').value,max_concurrent_tasks:+$('#aConcurrent').value,max_turn_seconds:$('#aTurnSecs').value===''?null:+$('#aTurnSecs').value,max_delegation_depth:+$('#aDelegDepth').value,max_session_tasks:+$('#aSessTasks').value,llm_config:{provider:$('#aProvider').value,model:$('#aModel').value}})})}closeModal();toast('Saved');agents()}catch(e){toast(e.message)}}
}
function historyModal(agentId,history){
  $('#modal').classList.remove('hidden');
  $('#modal').innerHTML=`<div class="dialog"><div class="row"><h3>Policy history</h3><span class="spacer"></span><button class="btn" id="closeM">Close</button></div>${history.length?history.map(h=>`<div class="listrow"><div class="row"><b>v${esc(h.generation)}</b><span class="spacer"></span><span class="mono muted" style="font-size:11px">${esc(h.changed_at)}</span><button class="btn small rollbackV" data-gen="${esc(h.generation)}">Rollback to this version</button></div><div class="mono" style="font-size:12px;margin-top:4px;white-space:pre-wrap">${esc((h.system_prompt||'').slice(0,220))}${(h.system_prompt||'').length>220?'…':''}</div><div class="muted" style="font-size:11px;margin-top:4px">max_steps ${esc(h.max_steps)} · max_retries ${esc(h.max_retries)} · concurrent ${esc(h.max_concurrent_tasks)} · turn_secs ${h.max_turn_seconds??'∞'} · deleg_depth ${esc(h.max_delegation_depth)} · session_tasks ${esc(h.max_session_tasks)}</div></div>`).join(''):'<div class="muted">No prior versions -- nothing has changed since this agent was created.</div>'}</div>`;
  $('#closeM').onclick=closeModal;
  document.querySelectorAll('.rollbackV').forEach(b=>b.onclick=async()=>{
    if(!confirm('Roll back to v'+b.dataset.gen+'? This restores that version\'s settings as a new version -- it does not delete history.'))return;
    try{await rpc('policy.rollback',{agent_id:agentId,generation:+b.dataset.gen});closeModal();toast('Rolled back');agents()}catch(e){toast(e.message)}
  });
}
function closeModal(){$('#modal').classList.add('hidden');$('#modal').innerHTML=''}

// --- Projects ---
async function projectsPage(){
  const d=await rpc('projects.list');state.projects=d.projects||[];
  $('#view').innerHTML=`<div class="row" style="margin-bottom:14px"><button class="btn primary" id="newProject">New project</button><span class="spacer"></span><span class="muted">${state.projects.length} projects</span></div><div class="panel"><table class="table"><thead><tr><th>Name</th><th>Description</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody>${state.projects.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.description||'—')}</td><td>${p.is_active?status('open'):status('disabled')}</td><td class="mono muted">${esc(p.created_at)}</td><td><button class="btn small toggleProject" data-id="${esc(p.project_id)}" data-active="${p.is_active}">${p.is_active?'Disable':'Enable'}</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">No projects yet.</td></tr>'}</tbody></table></div>`;
  $('#newProject').onclick=()=>projectModal();
  document.querySelectorAll('.toggleProject').forEach(b=>b.onclick=async()=>{try{await rpc('projects.update',{project_id:b.dataset.id,is_active:b.dataset.active!=='true'});toast('Saved');projectsPage()}catch(e){toast(e.message)}});
}
function projectModal(){
  $('#modal').classList.remove('hidden');
  $('#modal').innerHTML=`<div class="dialog"><div class="row"><h3>New project</h3><span class="spacer"></span><button class="btn" id="closeM">Close</button></div><div class="field"><label>Name</label><input class="input" id="pjName"></div><div class="field"><label>Description</label><textarea class="textarea" id="pjDesc"></textarea></div><button class="btn primary" id="savePj">Create</button></div>`;
  $('#closeM').onclick=closeModal;
  $('#savePj').onclick=async()=>{try{await rpc('projects.create',{name:$('#pjName').value,description:$('#pjDesc').value});closeModal();toast('Created');projectsPage()}catch(e){toast(e.message)}};
}

// --- Run: fire a session, optionally scoped to a project ---
async function runView(){
  if(!state.agents.length){const d=await api('/api/v1/agents');state.agents=d.agents||[]}
  const pd=await rpc('projects.list').catch(()=>({projects:[]}));state.projects=pd.projects||[];
  $('#view').innerHTML=`<div class="grid2"><div class="panel"><h3>Run agent</h3><div class="field"><label>Agent</label><select class="select" id="runAgent">${state.agents.filter(a=>a.is_active).map(a=>`<option value="${esc(a.agent_id)}">${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Project (optional)</label><select class="select" id="runProject"><option value="">— none —</option>${state.projects.filter(p=>p.is_active).map(p=>`<option value="${esc(p.project_id)}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Goal / prompt</label><textarea class="textarea" id="runGoal" placeholder="Ask the agent to do something…"></textarea></div><button class="btn primary" id="runBtn">Run</button></div><div class="panel"><h3>Live activity</h3><div id="live" class="muted">Waiting for events…</div></div></div>`;
  $('#runBtn').onclick=async()=>{try{const body={agent_id:$('#runAgent').value,goal:$('#runGoal').value};if($('#runProject').value)body.project_id=$('#runProject').value;const d=await api('/api/v1/run',{method:'POST',body:JSON.stringify(body)});toast('Task queued: '+d.task_id);$('#runGoal').value=''}catch(e){toast(e.message)}}
}

// --- Sessions: the thread list, and the thread itself (a modal) ---
async function sessionsPage(){
  const d=await rpc('sessions.list',{limit:200});state.sessions=d.sessions||[];
  $('#view').innerHTML=`<div class="panel"><table class="table"><thead><tr><th>Agent</th><th>Goal</th><th>Status</th><th>Started</th><th></th></tr></thead><tbody>${state.sessions.map(s=>`<tr><td>${esc(s.agent)}</td><td>${esc(s.goal)}</td><td>${status(s.status)}</td><td class="mono muted">${esc(s.started_at)}</td><td><button class="btn small openThread" data-id="${esc(s.session_id)}">Open</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">No sessions yet.</td></tr>'}</tbody></table></div>`;
  document.querySelectorAll('.openThread').forEach(b=>b.onclick=()=>threadModal(b.dataset.id));
}
function msgBubble(l){return `<div class="msg"><div class="row">${status(l.role)}<span class="spacer"></span><span class="mono muted" style="font-size:11px">${esc(l.created_at)}</span></div><div class="msg-body mono">${esc(fmtContent(l.content))}</div></div>`}
async function threadModal(sessionId){
  $('#modal').classList.remove('hidden');
  $('#modal').innerHTML=`<div class="dialog" style="width:min(760px,100%)"><div class="row"><h3>Thread</h3><span class="spacer"></span><button class="btn" id="closeM">Close</button></div><div id="threadBody" class="muted">Loading…</div></div>`;
  $('#closeM').onclick=closeModal;
  try{
    const [d,ap]=await Promise.all([rpc('sessions.get',{session_id:sessionId}),rpc('approvals.list',{limit:200})]);
    const s=d.session,taskIds=(d.tasks||[]).map(t=>t.task_id);
    const pending=(ap.approvals||[]).find(x=>taskIds.includes(x.task_id));
    const body=$('#threadBody');body.className='';
    body.innerHTML=`<div class="row" style="margin-bottom:10px"><b>${esc(s.agent)}</b><span class="spacer"></span>${status(s.status)}${s.status==='open'?`<button class="btn danger small" id="cancelSession">Cancel</button>`:''}</div><div class="muted" style="margin-bottom:10px">${esc(s.goal)}</div>${pending?`<div class="banner"><b>Waiting on you:</b> ${esc(pending.reason||'(no reason given)')}<div class="field" style="margin-top:8px"><textarea class="textarea" id="apReply" placeholder="Reply (optional)…" style="min-height:60px"></textarea></div><div class="row"><button class="btn primary small" id="apAccept">Approve</button><button class="btn danger small" id="apReject">Reject</button></div></div>`:''}<div style="max-height:50vh;overflow:auto;margin-top:10px">${(d.logs||[]).map(msgBubble).join('')||'<div class="muted">No messages yet.</div>'}</div>`;
    if(s.status==='open')$('#cancelSession').onclick=async()=>{if(!confirm('Cancel this session? Every open task in it will stop.'))return;try{await rpc('sessions.cancel',{session_id:sessionId,reason:'Cancelled from dashboard'});toast('Cancelled');threadModal(sessionId)}catch(e){toast(e.message)}};
    if(pending){
      $('#apAccept').onclick=()=>decideApproval(pending.approval_id,true,$('#apReply').value,()=>threadModal(sessionId));
      $('#apReject').onclick=()=>decideApproval(pending.approval_id,false,$('#apReply').value,()=>threadModal(sessionId));
    }
  }catch(e){$('#threadBody').textContent=e.message}
}

// --- Approvals: the inbox, decided inline or from the thread modal above ---
async function decideApproval(id,accept,reply,after){try{await rpc('approvals.decide',{approval_id:id,accept,reply});toast(accept?'Approved':'Rejected');after()}catch(e){toast(e.message)}}
async function approvalsPage(){
  const d=await rpc('approvals.list',{limit:200});state.approvals=d.approvals||[];
  $('#view').innerHTML=`<div class="panel">${state.approvals.length?state.approvals.map(a=>`<div class="listrow"><div class="row"><b>${esc(a.agent)}</b><span class="muted"> — ${esc(a.goal)}</span><span class="spacer"></span><span class="mono muted" style="font-size:11px">${esc(a.created_at)}</span></div><div style="margin:6px 0">${esc(a.reason||'(no reason given)')}</div><div class="field"><textarea class="textarea apReply" data-id="${esc(a.approval_id)}" placeholder="Reply (optional)…" style="min-height:50px"></textarea></div><div class="row"><button class="btn primary small apAccept" data-id="${esc(a.approval_id)}">Approve</button><button class="btn danger small apReject" data-id="${esc(a.approval_id)}">Reject</button><button class="btn small openThread" data-id="${esc(a.session_id)}">Open thread</button></div></div>`).join(''):'<div class="muted">No pending approvals.</div>'}</div>`;
  document.querySelectorAll('.apAccept').forEach(b=>b.onclick=()=>decideApproval(b.dataset.id,true,document.querySelector(`.apReply[data-id="${b.dataset.id}"]`)?.value||'',approvalsPage));
  document.querySelectorAll('.apReject').forEach(b=>b.onclick=()=>decideApproval(b.dataset.id,false,document.querySelector(`.apReply[data-id="${b.dataset.id}"]`)?.value||'',approvalsPage));
  document.querySelectorAll('.openThread').forEach(b=>b.onclick=()=>threadModal(b.dataset.id));
}

// --- Proposals: an agent's own propose_change actions (system_prompt / llm_config
// only -- see fn_submit_result) awaiting an operator decision, plus history ---
async function decideProposal(id,approve,reply,after){try{const r=await rpc('proposals.decide',{proposal_id:id,approve,reply});toast(r.status==='stale'?'Stale -- the policy changed since this was proposed':(approve?'Approved':'Rejected'));after()}catch(e){toast(e.message)}}
async function proposalsPage(){
  const d=await rpc('proposals.list',state.proposalAgentFilter?{agent_id:state.proposalAgentFilter}:{});
  state.proposals=d.proposals||[];
  const pending=state.proposals.filter(p=>p.status==='pending'),decided=state.proposals.filter(p=>p.status!=='pending');
  const changes=c=>`<div class="mono" style="font-size:12px;white-space:pre-wrap">${esc(JSON.stringify(c,null,2))}</div>`;
  $('#view').innerHTML=`${state.proposalAgentFilter?`<div class="row" style="margin-bottom:14px"><span class="muted">Showing proposals for one agent.</span><button class="btn small" id="clearFilter">Show all agents</button></div>`:''}
<div class="panel"><h3>Pending</h3>${pending.length?pending.map(p=>`<div class="listrow"><div class="row"><b>${esc(p.agent)}</b><span class="spacer"></span><span class="mono muted" style="font-size:11px">${esc(p.created_at)}</span></div><div style="margin:6px 0">${esc(p.reason||'(no reason given)')}</div>${changes(p.proposed_changes)}<div class="field"><textarea class="textarea prReply" data-id="${esc(p.proposal_id)}" placeholder="Reply (optional)…" style="min-height:50px"></textarea></div><div class="row"><button class="btn primary small prAccept" data-id="${esc(p.proposal_id)}">Approve</button><button class="btn danger small prReject" data-id="${esc(p.proposal_id)}">Reject</button></div></div>`).join(''):'<div class="muted">No pending proposals.</div>'}</div>
<div class="panel"><h3>Decided</h3>${decided.length?decided.map(p=>`<div class="listrow"><div class="row"><b>${esc(p.agent)}</b>${status(p.status)}<span class="spacer"></span><span class="mono muted" style="font-size:11px">${esc(p.decided_at||'')}</span></div>${p.reason?`<div class="muted" style="margin:6px 0">${esc(p.reason)}</div>`:''}${changes(p.proposed_changes)}${p.decided_reply?`<div class="muted" style="font-size:12px;margin-top:6px">Reply: ${esc(p.decided_reply)}</div>`:''}</div>`).join(''):'<div class="muted">No decided proposals yet.</div>'}</div>`;
  document.querySelectorAll('.prAccept').forEach(b=>b.onclick=()=>decideProposal(b.dataset.id,true,document.querySelector(`.prReply[data-id="${b.dataset.id}"]`)?.value||'',proposalsPage));
  document.querySelectorAll('.prReject').forEach(b=>b.onclick=()=>decideProposal(b.dataset.id,false,document.querySelector(`.prReply[data-id="${b.dataset.id}"]`)?.value||'',proposalsPage));
  const cf=$('#clearFilter');if(cf)cf.onclick=()=>{state.proposalAgentFilter=null;proposalsPage()};
}

async function tasks(){const d=await api('/api/v1/tasks');state.tasks=d.tasks||[];$('#view').innerHTML=`<div class="panel">${taskRows(state.tasks)}</div>`}
async function logs(){const d=await api('/api/v1/logs');state.logs=d.logs||[];$('#view').innerHTML=`<div class="panel"><table class="table"><thead><tr><th>Time</th><th>Agent</th><th>Role</th><th>Step</th><th>Content</th></tr></thead><tbody>${state.logs.map(l=>`<tr><td class="mono muted">${esc(l.created_at)}</td><td>${esc(l.agent)}</td><td>${status(l.role)}</td><td>${esc(l.step_number)}</td><td class="log mono">${esc(fmtContent(l.content))}</td></tr>`).join('')}</tbody></table></div>`}

// --- Settings: providers, dashboard access, and the SQL sandbox allowlist ---
async function settings(){
  const d=await api('/api/v1/settings');state.settings=d;
  const al=await rpc('allowlist.list').catch(()=>({allowlist:[]}));
  $('#view').innerHTML=`${secretBanner(d.secret_storage)}<div class="panel"><h3>LLM providers</h3><table class="table"><thead><tr><th>Name</th><th>Kind</th><th>Base URL</th><th>Secret</th><th>Private net</th><th>Status</th><th></th></tr></thead><tbody>${(d.providers||[]).map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.kind)}</td><td class="mono">${esc(p.base_url)}</td><td>${p.has_secret?'configured':'—'}</td><td>${p.allow_private_network?'allowed':'blocked'}</td><td>${p.is_enabled?status('running'):status('disabled')}</td><td><button class="btn editProvider" data-id="${esc(p.provider_id)}">Edit</button></td></tr>`).join('')}</tbody></table></div><div class="panel"><h3>SQL sandbox allowlist</h3><div class="muted" style="font-size:12px;margin-bottom:10px">Views an agent's <code>execute_sql</code> action may read from, in addition to that agent holding a matching view permission -- both are required. See README, "The SQL sandbox".</div><div id="allowList">${(al.allowlist||[]).map(r=>`<div class="row" style="padding:4px 0"><span class="mono" style="font-size:12px">${esc(r)}</span><span class="spacer"></span><button class="btn danger small removeAllow" data-ref="${esc(r)}">Remove</button></div>`).join('')||'<div class="muted" style="font-size:12px">Empty.</div>'}</div><div class="row" style="margin-top:10px"><input class="input" id="allowRef" placeholder="allgres_public.v_name"><button class="btn" id="addAllow">Add</button></div></div><div class="panel"><h3>Dashboard access</h3><div class="muted" style="font-size:13px;margin-bottom:10px">${tok()?'A token is set for this browser tab.':'No token set for this browser tab. If the server requires one, requests will return 401.'}</div><div class="row"><button class="btn" id="setTok">Set token</button><button class="btn" id="clrTok">Clear token</button><span class="spacer"></span><button class="btn" id="runSelftest">Run selftest</button></div><div id="selftestOut" class="mono muted" style="margin-top:12px"></div></div>`;
  document.querySelectorAll('.editProvider').forEach(b=>b.onclick=()=>providerModal(d.providers.find(p=>p.provider_id===b.dataset.id)));
  document.querySelectorAll('.removeAllow').forEach(b=>b.onclick=async()=>{try{await rpc('allowlist.remove',{ref:b.dataset.ref});toast('Removed');settings()}catch(e){toast(e.message)}});
  $('#addAllow').onclick=async()=>{try{await rpc('allowlist.add',{ref:$('#allowRef').value});toast('Added');settings()}catch(e){toast(e.message)}};
  $('#setTok').onclick=askToken;$('#clrTok').onclick=()=>{setTok('');location.reload()};
  $('#runSelftest').onclick=async()=>{try{$('#selftestOut').textContent='running…';const r=await api('/api/v1/selftest',{method:'POST'});$('#selftestOut').textContent=`passed ${r.passed}, failed ${r.failed}`+(r.failed?': '+(r.cases||[]).filter(c=>!c.ok).map(c=>c.name).join(', '):'')}catch(e){$('#selftestOut').textContent=e.message}}
}
function providerModal(p){
  const isOauth=p.kind==='oauth';
  const oauthFields=isOauth?`<div class="field"><label>Authorization URL</label><input class="input" id="pAuthUrl" value="${esc(p.oauth_auth_url||'')}"></div><div class="field"><label>Token URL</label><input class="input" id="pTokenUrl" value="${esc(p.oauth_token_url||'')}"></div><div class="field"><label>Client ID</label><input class="input" id="pClientId" value="${esc(p.oauth_client_id||'')}"></div><div class="field"><label>Client secret (leave blank to keep existing)</label><input type="password" class="input" id="pClientSecret" autocomplete="new-password"></div>`:'';
  const connectRow=isOauth?`<div class="row" style="margin:14px 0"><button class="btn" id="connectOauth">Connect via OAuth</button><span class="spacer"></span><span class="muted" style="font-size:12px">${p.has_secret?'A token is stored for this provider.':'Not connected yet.'}</span></div>`:'';
  $('#modal').classList.remove('hidden');$('#modal').innerHTML=`<div class="dialog"><div class="row"><h3>${esc(p.name)}</h3><span class="spacer"></span><button class="btn" id="closeM">Close</button></div><div class="field"><label>Base URL</label><input class="input" id="pUrl" value="${esc(p.base_url)}"></div>${isOauth?'':'<div class="field"><label>API key (leave blank to keep existing)</label><input type="password" class="input" id="pKey" autocomplete="new-password"></div>'}${oauthFields}<div class="field"><label><input type="checkbox" id="pEnabled" ${p.is_enabled?'checked':''}> Enabled</label></div><div class="field"><label><input type="checkbox" id="pPrivate" ${p.allow_private_network?'checked':''}> Allow loopback / private-network endpoint</label><div class="muted" style="font-size:12px">Needed for a local Ollama or an in-cluster gateway. Leaving this off is what stops this endpoint from being pointed at an internal address.</div></div>${connectRow}<button class="btn primary" id="saveP">Save</button></div>`;
  $('#closeM').onclick=closeModal;
  $('#saveP').onclick=async()=>{try{const body={provider_id:p.provider_id,base_url:$('#pUrl').value,is_enabled:$('#pEnabled').checked,allow_private_network:$('#pPrivate').checked};if(isOauth){body.oauth_auth_url=$('#pAuthUrl').value;body.oauth_token_url=$('#pTokenUrl').value;body.oauth_client_id=$('#pClientId').value;body.oauth_client_secret=$('#pClientSecret').value}else{body.api_key=$('#pKey').value}await api('/api/v1/settings/provider',{method:'POST',body:JSON.stringify(body)});closeModal();toast('Provider saved');settings()}catch(e){toast(e.message)}};
  // Full-page redirect to the provider's own login page, same as any other
  // OAuth "Connect" button -- the provider redirects back to this same
  // dashboard URL with ?code=&state=, which the boot-time handler below
  // (oauthCallbackOnLoad) picks up and completes via providers.oauth_callback.
  if(isOauth)$('#connectOauth').onclick=async()=>{try{const redirect=location.origin+location.pathname;const r=await rpc('providers.oauth_start',{provider_id:p.provider_id,redirect});if(r.redirect_url)location.href=r.redirect_url}catch(e){toast(e.message)}};
}
// The event stream authenticates with a short-lived, single-use ticket
// (POST /api/v1/events/ticket, gated by the real bearer token) instead of
// carrying the durable dashboard token in the URL -- EventSource cannot set
// headers, so something has to go in the query string, and this keeps it
// out of proxy access logs, browser history, and the Referrer header. The
// server closes the stream every ~30s on purpose (see stream_events in
// src/lib.rs) and does not send a `retry:` field, so reconnection is driven
// from here: mint a fresh ticket and open a new EventSource on every error,
// rather than relying on the browser's native retry-with-the-same-URL,
// which a single-use ticket cannot satisfy.
let esRetryTimer=null;
async function startEvents(){
  if(esRetryTimer){clearTimeout(esRetryTimer);esRetryTimer=null}
  let url='/api/v1/events';
  try{
    const t=await api('/api/v1/events/ticket',{method:'POST'});
    if(t.ticket)url+='?ticket='+encodeURIComponent(t.ticket)
  }catch(e){
    $('#health').textContent='reconnecting';
    esRetryTimer=setTimeout(startEvents,2000);
    return;
  }
  const es=new EventSource(url);
  es.addEventListener('snapshot',e=>{try{const d=JSON.parse(e.data);$('#health').textContent='workers online';const live=$('#live');if(live&&d.tasks){live.innerHTML=d.tasks.slice(0,8).map(t=>`<div class="row" style="padding:5px 0"><span>${esc(t.agent)}</span><span>${status(t.status)}</span><span class="mono muted">step ${esc(t.step_count)}</span></div>`).join('')||'No activity'} }catch{}});
  es.onerror=()=>{$('#health').textContent='reconnecting';es.close();esRetryTimer=setTimeout(startEvents,1500)};
}
// If the page just loaded from a provider's OAuth redirect (?code=&state=),
// complete the flow before anything else renders. The redirect_uri
// registered with the provider is this dashboard's own URL, so this is the
// only place a code/state pair can arrive -- there is no separate callback
// route. providers.oauth_callback only ever queues the exchange (see
// KNOWN_ISSUES.md, "a second-round external review of items 18 and 19"), so
// nothing secret ever reaches this page: the runtime worker performs the
// real token exchange in the background and settings.get's has_secret is
// how a later Settings load finds out it landed.
async function oauthCallbackOnLoad(){
  const qs=new URLSearchParams(location.search);
  const oauthCode=qs.get('code'), oauthState=qs.get('state');
  if(!oauthCode||!oauthState)return;
  history.replaceState({}, '', location.pathname);
  try{
    await rpc('providers.oauth_callback',{code:oauthCode,state:oauthState,redirect:location.origin+location.pathname});
    toast('OAuth exchange queued -- check back in a moment for the connected status.');
  }catch(e){toast('OAuth callback failed: '+e.message)}
  state.page='Settings';
}
oauthCallbackOnLoad().finally(()=>{nav();loadPage();startEvents()});
</script></body></html>
