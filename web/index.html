<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Allgres Control Plane</title><style nonce="__CSP_NONCE__">
:root{--bg:#0b0d10;--panel:#11151a;--panel2:#161b22;--line:#262d36;--text:#e6edf3;--muted:#8b949e;--accent:#7ee787;--accent2:#58a6ff;--bad:#ff7b72;--warn:#d29922}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;background:#0d1014}.brand{font-size:22px;font-weight:760;letter-spacing:-.5px}.tag{color:var(--muted);font-size:12px;margin:2px 0 28px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:8px;margin:2px 0;cursor:pointer}.nav button.active,.nav button:hover{background:var(--panel2);color:var(--text)}.main{padding:28px 32px;max-width:1500px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.title{font-size:24px;font-weight:700}.pill{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}.cards{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:12px;margin:16px 0 24px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}.card{padding:16px}.metric{font-size:28px;font-weight:720}.label{color:var(--muted);font-size:12px}.panel{padding:16px;margin-bottom:16px}.panel h3{margin:0 0 14px;font-size:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.spacer{flex:1}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#08110a;font-weight:650}.btn.danger{color:var(--bad)}.input,.textarea,.select{width:100%;background:#0d1117;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 10px}.textarea{min-height:110px;resize:vertical}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.status{font-size:11px;border:1px solid var(--line);padding:3px 7px;border-radius:999px}.s-completed{color:var(--accent)}.s-failed{color:var(--bad)}.s-running,.s-queued{color:var(--accent2)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.muted{color:var(--muted)}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:24px}.dialog{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}.toast{position:fixed;right:24px;bottom:24px;background:var(--panel2);border:1px solid var(--line);padding:10px 14px;border-radius:9px;display:none}.log{max-width:680px;white-space:pre-wrap;word-break:break-word}.hero{padding:18px 0 4px}.hero h2{font-size:30px;margin:0}.hero p{color:var(--muted);margin:4px 0}.banner{border:1px solid var(--warn);color:var(--warn);border-radius:9px;padding:10px 12px;margin-bottom:14px;font-size:13px}@media(max-width:900px){.app{grid-template-columns:1fr}.side{height:auto;position:relative;border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap}.main{padding:20px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Allgres</div><div class="tag">Postgres Is All You Need.</div><nav class="nav" id="nav"></nav></aside><main class="main"><div class="top"><div><div class="title" id="pageTitle">Overview</div><div class="muted" id="pageSub">PostgreSQL-native agent control plane</div></div><div class="pill"><span class="dot"></span><span id="health">connecting</span></div></div><div id="view"></div></main></div><div id="modal" class="modal hidden"></div><div id="toast" class="toast"></div>
<script nonce="__CSP_NONCE__">
const state={page:'Overview',agents:[],tasks:[],logs:[],settings:null,overview:null};
const pages=['Overview','Agents','Run','Tasks','Logs','Settings'];
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(s){const t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}

// The dashboard token, when one is configured, lives in sessionStorage only.
// Nothing persists it to disk and it is never placed in the page URL.
const tok=()=>sessionStorage.getItem('allgres_token')||'';
function setTok(v){v?sessionStorage.setItem('allgres_token',v):sessionStorage.removeItem('allgres_token')}
function askToken(){const v=prompt('Dashboard token (ALLGRES_DASHBOARD_TOKEN)');if(v!==null){setTok(v.trim());location.reload()}}

// X-Allgres-Client cannot be set by a cross-site form or <img>, so requiring it
// forces a preflight that the server never approves.
async function api(path,opt={}){
  opt.headers={...(opt.headers||{}),'Content-Type':'application/json','X-Allgres-Client':'dashboard'};
  if(tok())opt.headers['Authorization']='Bearer '+tok();
  const r=await fetch(path,opt);
  if(r.status===401){askToken();throw new Error('unauthorized')}
  const j=await r.json();
  if(j.ok===false)throw new Error(j.error||'request failed');
  return j;
}
function nav(){const n=$('#nav');n.innerHTML=pages.map(p=>`<button class="${state.page===p?'active':''}" data-p="${p}">${p}</button>`).join('');n.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.page=b.dataset.p;nav();loadPage()})}
function status(s){return `<span class="status s-${esc(s)}">${esc(s)}</span>`}
async function loadPage(){ $('#pageTitle').textContent=state.page; try{if(state.page==='Overview')await overview();if(state.page==='Agents')await agents();if(state.page==='Run')await runView();if(state.page==='Tasks')await tasks();if(state.page==='Logs')await logs();if(state.page==='Settings')await settings()}catch(e){toast(e.message)} }
async function overview(){const d=await api('/api/v1/status');state.overview=d;$('#view').innerHTML=`${secretBanner(d.secret_storage)}<div class="hero"><h2>One database. One extension.</h2><p>Agents, state, policy, queue, audit, native I/O and dashboard inside PostgreSQL.</p></div><div class="cards">${[['Agents',d.agents],['Active',d.active_agents],['Running',d.running_tasks],['Outbound',d.queued_outbound],['SQL',d.queued_sql],['Failed',d.failed_tasks]].map(x=>`<div class="card"><div class="metric">${x[1]}</div><div class="label">${x[0]}</div></div>`).join('')}</div><div class="grid2"><div class="panel"><h3>Workers</h3>${(d.workers||[]).map(w=>`<div class="row"><span class="dot"></span><span>${esc(w.name)}</span><span class="spacer"></span><span class="mono muted">PID ${esc(w.pid)}</span></div>`).join('')||'<div class="muted">No workers reported</div>'}</div><div class="panel"><h3>Recent tasks</h3>${taskRows(d.recent_tasks||[],true)}</div></div>`}
function secretBanner(mode){if(!mode||mode==='encrypted')return '';const why=mode==='plaintext_no_pgcrypto'?'pgcrypto is not installed':'allgres.secret_key is not set';return `<div class="banner">Provider API keys are stored in plaintext because ${esc(why)}. See README, "Secrets at rest".</div>`}
function taskRows(a,compact=false){if(!a.length)return '<div class="muted">No tasks yet.</div>';return `<table class="table"><thead><tr><th>Agent</th><th>Status</th><th>Goal</th>${compact?'':'<th>Steps</th><th>Updated</th>'}</tr></thead><tbody>${a.map(t=>`<tr><td>${esc(t.agent)}</td><td>${status(t.status)}</td><td>${esc(t.goal||'')}</td>${compact?'':`<td>${esc(t.step_count)}</td><td class="mono muted">${esc(t.updated_at||'')}</td>`}</tr>`).join('')}</tbody></table>`}
async function agents(){const d=await api('/api/v1/agents');state.agents=d.agents||[];$('#view').innerHTML=`<div class="row" style="margin-bottom:14px"><button class="btn primary" id="newAgent">New agent</button><span class="spacer"></span><span class="muted">${state.agents.length} agents</span></div><div class="panel"><table class="table"><thead><tr><th>Name</th><th>Model</th><th>Provider</th><th>Status</th><th>Permissions</th><th></th></tr></thead><tbody>${state.agents.map(a=>`<tr><td><b>${esc(a.name)}</b><div class="mono muted">${esc(a.agent_id).slice(0,12)}…</div></td><td>${esc(a.llm_config?.model||'—')}</td><td>${esc(a.llm_config?.provider||'—')}</td><td>${a.is_active?status('running'):status('disabled')}</td><td>${(a.permissions||[]).length}</td><td><button class="btn editAgent" data-id="${esc(a.agent_id)}">Edit</button></td></tr>`).join('')}</tbody></table></div>`;$('#newAgent').onclick=()=>agentModal();document.querySelectorAll('.editAgent').forEach(b=>b.onclick=()=>agentModal(state.agents.find(a=>a.agent_id===b.dataset.id)))}
function agentModal(a){const isNew=!a;$('#modal').classList.remove('hidden');$('#modal').innerHTML=`<div class="dialog"><div class="row"><h3>${isNew?'Create agent':'Edit agent'}</h3><span class="spacer"></span><button class="btn" id="closeM">Close</button></div><div class="field"><label>Name</label><input class="input" id="aName" value="${esc(a?.name||'')}"></div><div class="field"><label>System prompt</label><textarea class="textarea" id="aPrompt">${esc(a?.system_prompt||'')}</textarea></div>${isNew?'':`<div class="grid2"><div class="field"><label>Provider</label><input class="input" id="aProvider" value="${esc(a?.llm_config?.provider||'')}"></div><div class="field"><label>Model</label><input class="input" id="aModel" value="${esc(a?.llm_config?.model||'')}"></div></div><div class="muted" style="font-size:12px;margin:-4px 0 8px">The endpoint URL comes from the provider in Settings; an agent cannot override it.</div><div class="grid2"><div class="field"><label>Max steps</label><input type="number" class="input" id="aSteps" value="${esc(a.max_steps||20)}"></div><div class="field"><label>Max retries</label><input type="number" class="input" id="aRetries" value="${esc(a.max_retries||2)}"></div></div><div class="field"><label><input type="checkbox" id="aActive" ${a.is_active?'checked':''}> Active</label></div>`}<button class="btn primary" id="saveA">Save</button></div>`;$('#closeM').onclick=closeModal;$('#saveA').onclick=async()=>{try{if(isNew){await api('/api/v1/agents',{method:'POST',body:JSON.stringify({name:$('#aName').value,system_prompt:$('#aPrompt').value})})}else{await api('/api/v1/agents/'+encodeURIComponent(a.agent_id),{method:'PATCH',body:JSON.stringify({system_prompt:$('#aPrompt').value,is_active:$('#aActive').checked,max_steps:+$('#aSteps').value,max_retries:+$('#aRetries').value,llm_config:{provider:$('#aProvider').value,model:$('#aModel').value}})})}closeModal();toast('Saved');agents()}catch(e){toast(e.message)}}}
function closeModal(){$('#modal').classList.add('hidden');$('#modal').innerHTML=''}
async function runView(){if(!state.agents.length){const d=await api('/api/v1/agents');state.agents=d.agents||[]}$('#view').innerHTML=`<div class="grid2"><div class="panel"><h3>Run agent</h3><div class="field"><label>Agent</label><select class="select" id="runAgent">${state.agents.filter(a=>a.is_active).map(a=>`<option value="${esc(a.agent_id)}">${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Goal / prompt</label><textarea class="textarea" id="runGoal" placeholder="Ask the agent to do something…"></textarea></div><button class="btn primary" id="runBtn">Run</button></div><div class="panel"><h3>Live activity</h3><div id="live" class="muted">Waiting for events…</div></div></div>`;$('#runBtn').onclick=async()=>{try{const d=await api('/api/v1/run',{method:'POST',body:JSON.stringify({agent_id:$('#runAgent').value,goal:$('#runGoal').value})});toast('Task queued: '+d.task_id);$('#runGoal').value=''}catch(e){toast(e.message)}}}
async function tasks(){const d=await api('/api/v1/tasks');state.tasks=d.tasks||[];$('#view').innerHTML=`<div class="panel">${taskRows(state.tasks)}</div>`}
async function logs(){const d=await api('/api/v1/logs');state.logs=d.logs||[];$('#view').innerHTML=`<div class="panel"><table class="table"><thead><tr><th>Time</th><th>Agent</th><th>Role</th><th>Step</th><th>Content</th></tr></thead><tbody>${state.logs.map(l=>`<tr><td class="mono muted">${esc(l.created_at)}</td><td>${esc(l.agent)}</td><td>${status(l.role)}</td><td>${esc(l.step_number)}</td><td class="log mono">${esc(typeof l.content==='string'?l.content:JSON.stringify(l.content))}</td></tr>`).join('')}</tbody></table></div>`}
async function settings(){const d=await api('/api/v1/settings');state.settings=d;$('#view').innerHTML=`${secretBanner(d.secret_storage)}<div class="panel"><h3>LLM providers</h3><table class="table"><thead><tr><th>Name</th><th>Kind</th><th>Base URL</th><th>Secret</th><th>Private net</th><th>Status</th><th></th></tr></thead><tbody>${(d.providers||[]).map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.kind)}</td><td class="mono">${esc(p.base_url)}</td><td>${p.has_secret?'configured':'—'}</td><td>${p.allow_private_network?'allowed':'blocked'}</td><td>${p.is_enabled?status('running'):status('disabled')}</td><td><button class="btn editProvider" data-id="${esc(p.provider_id)}">Edit</button></td></tr>`).join('')}</tbody></table></div><div class="panel"><h3>Dashboard access</h3><div class="muted" style="font-size:13px;margin-bottom:10px">${tok()?'A token is set for this browser tab.':'No token set for this browser tab. If the server requires one, requests will return 401.'}</div><div class="row"><button class="btn" id="setTok">Set token</button><button class="btn" id="clrTok">Clear token</button><span class="spacer"></span><button class="btn" id="runSelftest">Run selftest</button></div><div id="selftestOut" class="mono muted" style="margin-top:12px"></div></div>`;document.querySelectorAll('.editProvider').forEach(b=>b.onclick=()=>providerModal(d.providers.find(p=>p.provider_id===b.dataset.id)));$('#setTok').onclick=askToken;$('#clrTok').onclick=()=>{setTok('');location.reload()};$('#runSelftest').onclick=async()=>{try{$('#selftestOut').textContent='running…';const r=await api('/api/v1/selftest',{method:'POST'});$('#selftestOut').textContent=`passed ${r.passed}, failed ${r.failed}`+(r.failed?': '+(r.cases||[]).filter(c=>!c.ok).map(c=>c.name).join(', '):'')}catch(e){$('#selftestOut').textContent=e.message}}}
function providerModal(p){$('#modal').classList.remove('hidden');$('#modal').innerHTML=`<div class="dialog"><div class="row"><h3>${esc(p.name)}</h3><span class="spacer"></span><button class="btn" id="closeM">Close</button></div><div class="field"><label>Base URL</label><input class="input" id="pUrl" value="${esc(p.base_url)}"></div><div class="field"><label>API key (leave blank to keep existing)</label><input type="password" class="input" id="pKey" autocomplete="new-password"></div><div class="field"><label><input type="checkbox" id="pEnabled" ${p.is_enabled?'checked':''}> Enabled</label></div><div class="field"><label><input type="checkbox" id="pPrivate" ${p.allow_private_network?'checked':''}> Allow loopback / private-network endpoint</label><div class="muted" style="font-size:12px">Needed for a local Ollama or an in-cluster gateway. Leaving this off is what stops this endpoint from being pointed at an internal address.</div></div><button class="btn primary" id="saveP">Save</button></div>`;$('#closeM').onclick=closeModal;$('#saveP').onclick=async()=>{try{await api('/api/v1/settings/provider',{method:'POST',body:JSON.stringify({provider_id:p.provider_id,base_url:$('#pUrl').value,api_key:$('#pKey').value,is_enabled:$('#pEnabled').checked,allow_private_network:$('#pPrivate').checked})});closeModal();toast('Provider saved');settings()}catch(e){toast(e.message)}}}
function startEvents(){const url='/api/v1/events'+(tok()?'?token='+encodeURIComponent(tok()):'');const es=new EventSource(url);es.addEventListener('snapshot',e=>{try{const d=JSON.parse(e.data);$('#health').textContent='workers online';const live=$('#live');if(live&&d.tasks){live.innerHTML=d.tasks.slice(0,8).map(t=>`<div class="row" style="padding:5px 0"><span>${esc(t.agent)}</span><span>${status(t.status)}</span><span class="mono muted">step ${esc(t.step_count)}</span></div>`).join('')||'No activity'} }catch{}});es.onerror=()=>{$('#health').textContent='reconnecting'}}
nav();loadPage();startEvents();
</script></body></html>
