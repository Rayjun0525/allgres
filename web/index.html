<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Allgres Control Plane</title><style nonce="__CSP_NONCE__">
:root{--bg:#101217;--sidebar:#12151b;--panel:#181c23;--panel2:#20252e;--line:#323946;--text:#edf0f5;--muted:#9ca5b2;--accent:#7487b8;--accent-hover:#8395c2;--accent2:#9a8ab0;--bad:#cf8585;--warn:#b99a62;--focus:#aeb9d3;--on-accent:#fff}
:root[data-theme="light"]{--bg:#f3f4f7;--sidebar:#f8f9fb;--panel:#fff;--panel2:#eceff3;--line:#cfd5dd;--text:#20242b;--muted:#626c78;--accent:#566c9e;--accent-hover:#485e8d;--accent2:#77658c;--bad:#a94f55;--warn:#8a6a32;--focus:#455b8a;--on-accent:#fff}
*{box-sizing:border-box}
html,body{min-width:0;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;background:var(--sidebar);min-width:0}
.brand{font-size:22px;font-weight:760;letter-spacing:-.5px}.tag{color:var(--muted);font-size:12px;margin:2px 0 28px}
.nav{display:grid;gap:4px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:8px;cursor:pointer}.nav button.active,.nav button:hover{background:var(--panel2);color:var(--text)}
.main{padding:28px 32px;max-width:1500px;width:100%;min-width:0}.top{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;margin-bottom:24px}.top>.row{justify-content:flex-end}.title{font-size:24px;font-weight:700}.pill{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:7px 11px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:14px;margin:18px 0 26px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}.card{padding:18px}.metric{font-size:28px;font-weight:720}.label{color:var(--muted);font-size:12px}.panel{padding:20px;margin-bottom:18px;min-width:0;overflow-x:auto}.panel h3{margin:0 0 16px;font-size:15px}.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-width:0}.row.wrap{flex-wrap:wrap}.row>.input,.row>.select,.row>.textarea{flex:1 1 220px;width:auto;min-width:0}.spacer{flex:1 1 16px}.btn{flex:0 0 auto;min-height:36px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 13px;border-radius:8px;line-height:1.2;white-space:nowrap;cursor:pointer;transition:background .15s,border-color .15s,color .15s}.btn:hover{background:var(--line);border-color:var(--muted)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:650}.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}.btn.danger{color:var(--bad);background:transparent}.btn.small{min-height:30px;padding:6px 9px;font-size:11px}.btn:focus-visible,.input:focus-visible,.textarea:focus-visible,.select:focus-visible,.nav button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.input,.textarea,.select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 11px;min-width:0}.textarea{min-height:110px;resize:vertical}.field{margin:14px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.table{width:100%;min-width:620px;border-collapse:collapse}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.table tr:last-child td{border-bottom:0}.status{display:inline-flex;align-items:center;font-size:11px;border:1px solid var(--line);padding:3px 8px;border-radius:999px;white-space:nowrap}.s-completed,.s-approved{color:var(--accent)}.s-failed,.s-rejected,.s-cancelled{color:var(--bad)}.s-running,.s-queued,.s-open{color:var(--accent2)}.s-waiting_human,.s-pending{color:var(--warn)}.s-stale{color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.muted{color:var(--muted)}.hidden{display:none!important}.modal{position:fixed;z-index:20;inset:0;background:rgba(5,7,10,.72);display:flex;align-items:center;justify-content:center;padding:24px}.dialog{width:min(700px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}.dialog>h3,.dialog>.row:first-child h3{margin:0}.toast{position:fixed;z-index:30;right:24px;bottom:24px;background:var(--panel2);border:1px solid var(--line);padding:11px 15px;border-radius:9px;display:none}.log{max-width:680px;white-space:pre-wrap;word-break:break-word}.hero{padding:18px 0 4px;min-width:0}.hero h2{font-size:30px;margin:0;overflow-wrap:anywhere}.hero p{color:var(--muted);margin:4px 0;overflow-wrap:anywhere}.panel>.row.wrap>div{min-width:0}.panel>.row.wrap>div>div:last-child{overflow-wrap:anywhere}.banner{border:1px solid var(--warn);color:var(--warn);border-radius:9px;padding:11px 13px;margin-bottom:16px;font-size:13px}.msg{padding:10px 0;border-bottom:1px solid var(--line)}.msg-body{margin-top:4px;white-space:pre-wrap;word-break:break-word}.bubblerow{display:flex;padding:4px 0}.bubblerow-me{justify-content:flex-end}.bubblerow-agent{justify-content:flex-start}.bubblerow-op{justify-content:center}.bubble{max-width:78%;border-radius:14px;padding:9px 13px;border:1px solid var(--line)}.bubble-me{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}.bubble-agent{background:var(--panel2)}.bubble-op{background:transparent;border-style:dashed}.bubble-meta{display:flex;gap:8px;align-items:center;margin-bottom:3px}.bubblerow-me .bubble-meta{flex-direction:row-reverse}.bubble-body{white-space:pre-wrap;word-break:break-word;line-height:1.45}.listrow{padding:12px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border-bottom:0}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{height:auto;position:relative;border-right:0;border-bottom:1px solid var(--line);padding:18px 16px}.tag{margin-bottom:14px}.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.nav button{width:auto;white-space:nowrap}.main{padding:20px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media(max-width:600px){.main{padding:14px}.panel{padding:15px;margin-bottom:14px}.cards{grid-template-columns:1fr;gap:10px}.top{align-items:flex-start}.top>.row{width:100%;justify-content:flex-start}.hero h2{font-size:25px;line-height:1.2}.modal{padding:10px}.dialog{padding:16px}.bubble{max-width:92%}.table{min-width:560px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Allgres</div><div class="tag">Postgres Is All You Need.</div><nav class="nav" id="nav"></nav></aside><main class="main"><div class="top"><div><div class="title" id="pageTitle">Overview</div><div class="muted" id="pageSub">PostgreSQL-native agent control plane</div></div><div class="row"><span class="muted mono" id="whoami" style="font-size:12px"></span><button class="btn small" id="logoutBtn">Sign out</button><div class="pill"><span class="dot"></span><span id="health">connecting</span></div></div></div><div id="view"></div></main></div><div id="modal" class="modal hidden"></div><div id="toast" class="toast"></div>
<script nonce="__CSP_NONCE__">
const state={page:'Overview',me:null,agents:[],myAgents:[],users:[],chatAgentId:null,chatMode:'general',chatProjectId:null,projects:[],sessions:[],approvals:[],proposals:[],fixes:[],proposalAgentFilter:null,tasks:[],logs:[],memories:[],auditLog:[],settings:null,overview:null,procedures:[],procedureTools:[],auditTab:'Log',approvalsTab:'Approvals'};
// Sessions/Tasks/Logs folded into Audit (as tabs); Users folded into
// Settings (as a section); Approvals/Proposals/Fixes folded into one
// Approvals page (as tabs, open to regular users too -- item 41); Chat/
// Messenger/Project folded into one Chat page (as a mode switch -- item
// 43). Nav is simpler because of it, not because anything was removed.
const adminPages=['Overview','Agents','Chat','Approvals','Projects','Run','Memories','Audit','Settings'];
const userPages=['Chat','Approvals','My Agents'];
function pagesForRole(){return state.me?.role==='admin'?adminPages:userPages}
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(s){const t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}

// Language (item 46) and theme (item 47): both a plain per-browser
// preference, kept in localStorage -- nothing server-side to configure,
// nothing that needs to survive a different browser. I18N covers nav
// labels, page chrome, and common actions/empty-states -- not every field
// label in every modal, and never data that came from the database itself
// (an agent's own name, a log's own content), which is not translatable
// content to begin with.
const I18N={
  en:{Overview:'Overview',Agents:'Agents',Chat:'Chat',Approvals:'Approvals',Projects:'Projects',Run:'Run',Memories:'Memories',Audit:'Audit',Settings:'Settings','My Agents':'My Agents',
    general:'General',messenger:'Messenger',project:'Project',
    save:'Save',cancel:'Cancel',close:'Close',edit:'Edit',create:'Create',approve:'Approve',reject:'Reject',send:'Send',delete:'Delete',
    signIn:'Sign in',signOut:'Sign out',username:'Username',password:'Password',
    language:'Language',theme:'Theme',dark:'Dark',light:'Light',
    noData:'Nothing here yet.',loading:'Loading…',
    sessionsTab:'Sessions',tasksTab:'Tasks',logsTab:'Logs',auditTab:'Audit log',
    approvalsTab:'Approvals',proposalsTab:'Proposals',fixesTab:'Fixes',
    usersSection:'Users',providersSection:'LLM providers',sandboxSection:'SQL sandbox allowlist',accessSection:'Dashboard access',
  },
  ko:{Overview:'개요',Agents:'에이전트',Chat:'채팅',Approvals:'승인대기',Projects:'프로젝트',Run:'실행',Memories:'메모리',Audit:'감사',Settings:'설정','My Agents':'내 에이전트',
    general:'일반',messenger:'메신저',project:'프로젝트',
    save:'저장',cancel:'취소',close:'닫기',edit:'수정',create:'생성',approve:'승인',reject:'거부',send:'보내기',delete:'삭제',
    signIn:'로그인',signOut:'로그아웃',username:'아이디',password:'비밀번호',
    language:'언어',theme:'테마',dark:'다크',light:'라이트',
    noData:'아직 없습니다.',loading:'불러오는 중…',
    sessionsTab:'세션',tasksTab:'작업',logsTab:'로그',auditTab:'감사 로그',
    approvalsTab:'승인',proposalsTab:'제안',fixesTab:'수정 제안',
    usersSection:'사용자',providersSection:'LLM 프로바이더',sandboxSection:'SQL 샌드박스 허용목록',accessSection:'대시보드 접근',
  }
};
function lang(){return localStorage.getItem('allgres_lang')||'en'}
function setLang(v){try{localStorage.setItem('allgres_lang',v)}catch{}}
function t(key){const d=I18N[lang()]||I18N.en;return d[key]??I18N.en[key]??key}

function theme(){return localStorage.getItem('allgres_theme')||''}
function setTheme(v){try{v?localStorage.setItem('allgres_theme',v):localStorage.removeItem('allgres_theme')}catch{};document.documentElement.setAttribute('data-theme',v||'dark')}
setTheme(theme());

// The dashboard token, when one is configured, lives in sessionStorage only.
// Nothing persists it to disk and it is never placed in the page URL.
const tok=()=>sessionStorage.getItem('allgres_token')||'';
function setTok(v){v?sessionStorage.setItem('allgres_token',v):sessionStorage.removeItem('allgres_token')}
function askToken(){const v=prompt('Dashboard token (ALLGRES_DASHBOARD_TOKEN)');if(v!==null){setTok(v.trim());location.reload()}}

// Self-reported label only -- there is no per-operator account system (see
// README, "Operator audit log"): anyone holding the one shared dashboard
// token can type any name here, or leave it blank. It exists so
// audit_log answers "who claimed responsibility for this," not "who was
// authenticated to do it."
const opName=()=>sessionStorage.getItem('allgres_operator')||'';
function setOpName(v){v?sessionStorage.setItem('allgres_operator',v):sessionStorage.removeItem('allgres_operator')}
function askOpName(){const v=prompt('Your name, for the audit log (optional -- self-reported, not authentication)',opName());if(v!==null)setOpName(v.trim())}

// A real per-user login (README, "Model configuration and conversations"),
// layered on top of the dashboard token above rather than replacing it: the
// token still gates the whole HTTP surface; this identifies *who*, within
// that, is using it, and scopes the chat/messenger/model-config surface to
// their role and assigned agents.
const sessTok=()=>sessionStorage.getItem('allgres_session_token')||'';
function setSessTok(v){v?sessionStorage.setItem('allgres_session_token',v):sessionStorage.removeItem('allgres_session_token')}

// X-Allgres-Client cannot be set by a cross-site form or <img>, so requiring it
// forces a preflight that the server never approves.
async function api(path,opt={}){
  opt.headers={...(opt.headers||{}),'Content-Type':'application/json','X-Allgres-Client':'dashboard'};
  if(tok())opt.headers['Authorization']='Bearer '+tok();
  // A GET route (tasks.list/logs.list) carries no body for session_token to
  // ride in -- a header instead of a query string, so the token never lands
  // in a URL (server logs, browser history, Referer). Harmless to also send
  // on every other api() call; the legacy POST routes already put
  // session_token in their own JSON body, so the server just ignores this
  // header there.
  if(sessTok())opt.headers['X-Allgres-Session']=sessTok();
  const r=await fetch(path,opt);
  if(r.status===401){askToken();throw new Error('unauthorized')}
  const j=await r.json();
  if(j.ok===false)throw new Error(j.error||'request failed');
  return j;
}
// Generic dashboard_rpc passthrough: every action added since agents/run/
// tasks/logs/settings (projects.*, approvals.*, sessions.*, permissions.*,
// allowlist.*, policy.history) reaches allgres.dashboard_rpc through this one
// route instead of a named one, so a new SQL-side action never needs a Rust
// or dashboard rebuild to become reachable -- only this file changes.
const rpc=(action,body={})=>api('/api/v1/rpc',{method:'POST',body:JSON.stringify({action,operator_name:opName(),session_token:sessTok(),...body})});

function nav(){const n=$('#nav');const list=pagesForRole();n.innerHTML=list.map(p=>`<button class="${state.page===p?'active':''}" data-p="${p}">${esc(t(p))}</button>`).join('');n.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.page=b.dataset.p;nav();loadPage()});renderWhoami()}
function renderWhoami(){const el=$('#whoami');if(!el)return;el.textContent=state.me?`${state.me.username} (${state.me.role})`:'';const lb=$('#logoutBtn');if(lb)lb.textContent=t('signOut')}
function status(s){return `<span class="status s-${esc(s)}">${esc(s)}</span>`}
function fmtContent(c){return typeof c==='string'?c:JSON.stringify(c)}
function fmtInterval(sec){sec=Number(sec)||0;if(sec%86400===0&&sec>=86400)return (sec/86400)+'d';if(sec%3600===0&&sec>=3600)return (sec/3600)+'h';if(sec%60===0&&sec>=60)return (sec/60)+'m';return sec+'s'}
// A chat bubble's assistant turn is the agent's raw step-loop reply --
// {"action":"final_answer","answer":"..."} is the protocol shape every
// agent in this system must reply in (see fn_next_step's own prompt), not
// something a chat UI should show verbatim. Only that one shape unwraps to
// plain text; anything else (execute_sql, an error, mid-turn actions still
// worth seeing) falls back to the same raw rendering fmtContent already
// gives everywhere else (Logs' full transcript included -- deliberately
// untouched, since that view exists to show exactly this).
function chatText(l){
  if(l.role==='assistant'&&typeof l.content==='string'){
    try{
      const p=JSON.parse(l.content);
      if(p&&p.action==='final_answer'&&typeof p.answer==='string')return p.answer;
    }catch(e){}
  }
  return fmtContent(l.content);
}
async function loadPage(){
  // Chat/Messenger poll for an async reply on a setInterval; leaving the
  // page must stop it, or it keeps firing against DOM elements (#chatThread/
  // #msgFeed) that no longer exist once another page has rendered.
  if(chatPollTimer){clearInterval(chatPollTimer);chatPollTimer=null}
  if(msgPollTimer){clearInterval(msgPollTimer);msgPollTimer=null}
  if(projectChatPollTimer){clearInterval(projectChatPollTimer);projectChatPollTimer=null}
  $('#pageTitle').textContent=t(state.page); try{
  if(state.page==='Overview')await overview();
  if(state.page==='Agents')await agents();
  if(state.page==='Projects')await projectsPage();
  if(state.page==='Run')await runView();
  if(state.page==='Approvals')await approvalsPage();
  if(state.page==='Memories')await memoriesPage();
  if(state.page==='Audit')await auditPage();
  if(state.page==='Settings')await settings();
  if(state.page==='Chat')await chatPage();
  if(state.page==='My Agents')await myAgentsPage();
}catch(e){toast(e.message)} }

// Cluster monitoring (item 44): PostgreSQL's own version + this database's
// pg_stat_activity session counts come from dashboard_rpc's overview
// branch directly; host_stats (OS CPU load, memory) is the one thing SQL
// cannot see on its own -- native_host_stats reads it from /proc.
function clusterCard(){
  const h=state.overview?.host||{};
  const load=h.load?`${h.load.load1?.toFixed(2)} / ${h.load.load5?.toFixed(2)} / ${h.load.load15?.toFixed(2)}`:'—';
  const mem=h.memory?`${h.memory.used_mb.toLocaleString()} / ${h.memory.total_mb.toLocaleString()} MB (${h.memory.used_pct.toFixed(0)}%)`:'—';
  const db=state.overview?.db_sessions||{};
  return `<div class="panel"><h3>Cluster</h3><div class="row wrap" style="gap:20px"><div><div class="label">PostgreSQL</div><div>${esc(state.overview?.pg_version||'—')}</div></div><div><div class="label">CPUs / load (1m·5m·15m)</div><div>${esc(h.cpu_count??'—')} · ${esc(load)}</div></div><div><div class="label">Memory used / total</div><div>${esc(mem)}</div></div><div><div class="label">DB sessions (active/idle/total)</div><div>${esc(db.active??0)} / ${esc(db.idle??0)} / ${esc(db.total??0)}</div></div></div></div>`;
}
async function overview(){const d=await api('/api/v1/status');state.overview=d;$('#view').innerHTML=`${secretBanner(d.secret_storage)}<div class="hero"><h2>One database. One extension.</h2><p>Agents, state, policy, queue, audit, native I/O and dashboard inside PostgreSQL.</p></div>${clusterCard()}<div class="cards">${[['Agents',d.agents],['Active',d.active_agents],['Running',d.running_tasks],['Outbound',d.queued_outbound],['SQL',d.queued_sql],['Approvals',d.pending_approvals],['Failed',d.failed_tasks]].map(x=>`<div class="card"><div class="metric">${x[1]}</div><div class="label">${x[0]}</div></div>`).join('')}</div><div class="grid2"><div class="panel"><h3>Workers</h3>${(d.workers||[]).map(w=>`<div class="row"><span class="dot"></span><span>${esc(w.name)}</span><span class="spacer"></span><span class="mono muted">PID ${esc(w.pid)}</span></div>`).join('')||'<div class="muted">No workers reported</div>'}</div><div class="panel"><h3>Recent tasks</h3>${taskRows(d.recent_tasks||[],true)}</div></div>`}
function secretBanner(mode){if(!mode||mode==='encrypted')return '';const why=mode==='plaintext_no_pgcrypto'?'pgcrypto is not installed':'allgres.secret_key is not set';return `<div class="banner">Provider API keys are stored in plaintext because ${esc(why)}. See README, "Secrets at rest".</div>`}
function taskRows(a,compact=false){if(!a.length)return '<div class="muted">No tasks yet.</div>';return `<table class="table"><thead><tr><th>Agent</th><th>Status</th><th>Goal</th>${compact?'':'<th>Steps</th><th>Updated</th>'}</tr></thead><tbody>${a.map(t=>`<tr><td>${esc(t.agent)}</td><td>${status(t.status)}</td><td>${esc(t.goal||'')}</td>${compact?'':`<td>${esc(t.step_count)}</td><td class="mono muted">${esc(t.updated_at||'')}</td>`}</tr>`).join('')}</tbody></table>`}

// --- Agents: CRUD, plus permissions and policy history in the edit modal ---
// is_system/parent_name/autonomy_level (item 32/33): a system agent shows
// its place in the root+five hierarchy and its autonomy dial right in the
// list, not just buried in the edit modal.
async function agents(){const d=await api('/api/v1/agents');state.agents=d.agents||[];$('#view').innerHTML=`<div class="row" style="margin-bottom:14px"><button class="btn primary" id="newAgent">New agent</button><span class="spacer"></span><span class="muted">${state.agents.length} agents</span></div><div class="panel"><table class="table"><thead><tr><th>Name</th><th>Model</th><th>Provider</th><th>Status</th><th>Permissions</th><th>System</th><th></th></tr></thead><tbody>${state.agents.map(a=>`<tr><td><b>${esc(a.name)}</b>${a.parent_name?`<div class="muted" style="font-size:11px">child of ${esc(a.parent_name)}</div>`:''}<div class="mono muted">${esc(a.agent_id).slice(0,12)}…</div></td><td>${esc(a.llm_config?.model||'—')}</td><td>${esc(a.llm_config?.provider||'—')}</td><td>${a.is_active?status('running'):status('disabled')}</td><td>${(a.permissions||[]).length}</td><td>${a.is_system?`<span class="status s-waiting_human">${esc(a.autonomy_level)}</span>`:'—'}</td><td><button class="btn editAgent" data-id="${esc(a.agent_id)}">${esc(t('edit'))}</button></td></tr>`).join('')}</tbody></table></div>`;$('#newAgent').onclick=()=>agentModal();document.querySelectorAll('.editAgent').forEach(b=>b.onclick=()=>agentModal(state.agents.find(a=>a.agent_id===b.dataset.id)))}
// agent_config (item 49-52): a generic jsonb bag on the agent row for
// whatever per-agent-kind behavior needs to be admin-tunable without a
// schema migration per parameter. Known keys get a named, labeled field
// here (blank = clear the key, restoring the coded default -- same idiom
// as Max turn seconds above); the raw JSON textarea is the forward-
// compatible fallback for anything not given a named field yet, and is
// merged with (overridden by) the named fields on save.
function agentConfigFields(a){
  const cfg=a.agent_config||{};
  const named=[];
  if(a.name==='session_compactor'){

// Roadmap item 7: fn_evaluate_last_change surfaced as a read-only verdict --
// whether this agent's own recent completed/failed ratio is better, worse,
// or the same as it was right before its last policy change. No action
// here rolls anything back automatically; this is purely something for an
// operator (or a future self_improve turn) to read and decide from.
function evaluateModal(r){
  $('#modal').classList.remove('hidden');
  const color={improved:'var(--accent)',regressed:'var(--bad)'}[r.verdict]||'var(--muted)';
  $('#modal').innerHTML=`<div class="dialog"><div class="row"><h3>Evaluate last change</h3><span class="spacer"></span><button class="btn" id="closeM">Close</button></div>

<div class="muted" style="font-size:12px;line-height:1.6">
current success rate: ${r.current_success_rate??'no evaluable data yet'} (${r.current_sample_size??0} sample${r.current_sample_size===1?'':'s'})<br>
success rate before that change: ${r.success_rate_before_last_change??'no evaluable data yet'} (${r.before_sample_size??0} sample${r.before_sample_size===1?'':'s'})<br>
compared to generation: ${r.compared_to_generation??'—'}<br>
last changed at: ${r.last_changed_at?esc(r.last_changed_at):'—'}<br>
${r.verdict==='insufficient_data'?`<span style="color:var(--muted)">needs at least ${r.min_samples_required??5} evaluable tasks on each side to judge a trend</span><br>`:''}
completion rate only -- not a judge of whether the agent's actual output was correct
</div></div>`;
  $('#closeM').onclick=closeModal;
}

async function approvalsPage(){
  const tabs=[['Approvals','approvalsTab'],['Proposals','proposalsTab'],['Fixes','fixesTab']];
  $('#view').innerHTML=`<div class="row" style="margin-bottom:14px">${tabs.map(([tb,k])=>`<button class="btn small apTabBtn${state.approvalsTab===tb?' primary':''}" data-tab="${tb}">${esc(t(k))}</button>`).join('')}</div><div id="apTabBody"></div>`;
  document.querySelectorAll('.apTabBtn').forEach(b=>b.onclick=()=>{state.approvalsTab=b.dataset.tab;approvalsPage()});
  const body=$('#apTabBody');
  if(state.approvalsTab==='Approvals')await approvalsTab(body);
  if(state.approvalsTab==='Proposals')await proposalsTab(body);
  if(state.approvalsTab==='Fixes')await fixesTab(body);
}
async function decideApproval(id,accept,reply,after){try{await rpc('approvals.decide',{approval_id:id,accept,reply});toast(accept?'Approved':'Rejected');after()}catch(e){toast(e.message)}}
async function approvalsTab(target){
  target=target||$('#view');
  const d=await rpc('approvals.list',{limit:200});state.approvals=d.approvals||[];
  target.innerHTML=`<div class="panel">${state.approvals.length?state.approvals.map(a=>`<div class="listrow"><div class="row"><b>${esc(a.agent)}</b><span class="muted"> — ${esc(a.goal)}</span><span class="spacer"></span><span class="mono muted" style="font-size:11px">${esc(a.created_at)}</span></div><div style="margin:6px 0">${esc(a.reason||'(no reason given)')}</div><div class="field"><textarea class="textarea apReply" data-id="${esc(a.approval_id)}" placeholder="Reply (optional)…" style="min-height:50px"></textarea></div><div class="row"><button class="btn primary small apAccept" data-id="${esc(a.approval_id)}">${esc(t('approve'))}</button><button class="btn danger small apReject" data-id="${esc(a.approval_id)}">${esc(t('reject'))}</button><button class="btn small openThread" data-id="${esc(a.session_id)}">Open thread</button></div></div>`).join(''):`<div class="muted">${esc(t('noData'))}</div>`}</div>`;
  target.querySelectorAll('.apAccept').forEach(b=>b.onclick=()=>decideApproval(b.dataset.id,true,target.querySelector(`.apReply[data-id="${b.dataset.id}"]`)?.value||'',approvalsPage));
  target.querySelectorAll('.apReject').forEach(b=>b.onclick=()=>decideApproval(b.dataset.id,false,target.querySelector(`.apReply[data-id="${b.dataset.id}"]`)?.value||'',approvalsPage));
  target.querySelectorAll('.openThread').forEach(b=>b.onclick=()=>threadModal(b.dataset.id));
}

// --- Proposals: an agent's own propose_change/create_agent actions (see
// fn_submit_result) awaiting a decision, plus history ---
async function decideProposal(id,approve,reply,after){try{const r=await rpc('proposals.decide',{proposal_id:id,approve,reply});toast(r.status==='stale'?'Stale -- the policy changed since this was proposed':(approve?'Approved':'Rejected'));after()}catch(e){toast(e.message)}}
async function proposalsTab(target){
  target=target||$('#view');
  const d=await rpc('proposals.list',state.proposalAgentFilter?{agent_id:state.proposalAgentFilter}:{});
  state.proposals=d.proposals||[];
  const pending=state.proposals.filter(p=>p.status==='pending'),decided=state.proposals.filter(p=>p.status!=='pending');
  const changes=c=>`<div class="mono" style="font-size:12px;white-space:pre-wrap">${esc(JSON.stringify(c,null,2))}</div>`;
  const label=p=>p.kind==='create_agent'?`${esc(p.agent)} → new agent "${esc(p.proposed_changes?.name||'')}"`:(p.target_agent&&p.target_agent!==p.agent?`${esc(p.agent)} → ${esc(p.target_agent)}`:esc(p.agent));
  target.innerHTML=`${state.proposalAgentFilter?`<div class="row" style="margin-bottom:14px"><span class="muted">Showing proposals for one agent.</span><button class="btn small" id="clearFilter">Show all agents</button></div>`:''}
<div class="panel"><h3>Pending</h3>${pending.length?pending.map(p=>`<div class="listrow"><div class="row"><b>${label(p)}</b><span class="spacer"></span><span class="mono muted" style="font-size:11px">${esc(p.created_at)}</span></div><div style="margin:6px 0">${esc(p.reason||'(no reason given)')}</div>${changes(p.proposed_changes)}<div class="field"><textarea class="textarea prReply" data-id="${esc(p.proposal_id)}" placeholder="Reply (optional)…" style="min-height:50px"></textarea></div><div class="row"><button class="btn primary small prAccept" data-id="${esc(p.proposal_id)}">${esc(t('approve'))}</button><button class="btn danger small prReject" data-id="${esc(p.proposal_id)}">${esc(t('reject'))}</button></div></div>`).join(''):`<div class="muted">${esc(t('noData'))}</div>`}</div>
<div class="panel"><h3>Decided</h3>${decided.length?decided.map(p=>`<div class="listrow"><div class="row"><b>${label(p)}</b>${status(p.status)}<span class="spacer"></span><span class="mono muted" style="font-size:11px">${esc(p.decided_at||'')}</span></div>${p.reason?`<div class="muted" style="margin:6px 0">${esc(p.reason)}</div>`:''}${changes(p.proposed_changes)}${p.decided_reply?`<div class="muted" style="font-size:12px;margin-top:6px">Reply: ${esc(p.decided_reply)}</div>`:''}</div>`).join(''):'<div class="muted">No decided proposals yet.</div>'}</div>`;
  target.querySelectorAll('.prAccept').forEach(b=>b.onclick=()=>decideProposal(b.dataset.id,true,target.querySelector(`.prReply[data-id="${b.dataset.id}"]`)?.value||'',approvalsPage));
  target.querySelectorAll('.prReject').forEach(b=>b.onclick=()=>decideProposal(b.dataset.id,false,target.querySelector(`.prReply[data-id="${b.dataset.id}"]`)?.value||'',approvalsPage));
  const cf=target.querySelector('#clearFilter');if(cf)cf.onclick=()=>{state.proposalAgentFilter=null;approvalsPage()};
}

// --- Fixes: fixer's remediation proposals (revoke a permission, or
// deactivate an agent) built from what health_monitor's own views show. ---
async function decideFix(id,approve,reply,after){try{const r=await rpc('fixes.decide',{fix_id:id,approve,reply});toast(approve?'Approved':'Rejected');after()}catch(e){toast(e.message)}}
async function fixesTab(target){
  target=target||$('#view');
  const d=await rpc('fixes.list',{});state.fixes=d.fixes||[];
  const pending=state.fixes.filter(f=>f.status==='pending'),decided=state.fixes.filter(f=>f.status!=='pending');
  const detail=f=>`<div class="mono" style="font-size:12px">${esc(f.fix_kind)} → ${esc(f.target_agent)}${f.detail&&Object.keys(f.detail).length?': '+esc(JSON.stringify(f.detail)):''}</div>`;
  target.innerHTML=`<div class="panel"><h3>Pending</h3>${pending.length?pending.map(f=>`<div class="listrow"><div class="row"><b>${esc(f.agent)}</b><span class="spacer"></span><span class="mono muted" style="font-size:11px">${esc(f.created_at)}</span></div>${detail(f)}<div class="muted" style="margin:6px 0">${esc(f.reason||'(no reason given)')}</div><div class="row"><button class="btn primary small fxAccept" data-id="${esc(f.fix_id)}">${esc(t('approve'))}</button><button class="btn danger small fxReject" data-id="${esc(f.fix_id)}">${esc(t('reject'))}</button></div></div>`).join(''):`<div class="muted">${esc(t('noData'))}</div>`}</div>
<div class="panel"><h3>Decided</h3>${decided.length?decided.map(f=>`<div class="listrow"><div class="row"><b>${esc(f.agent)}</b>${status(f.status)}<span class="spacer"></span><span class="mono muted" style="font-size:11px">${esc(f.decided_at||'')}</span></div>${detail(f)}</div>`).join(''):'<div class="muted">No decided fixes yet.</div>'}</div>`;
  target.querySelectorAll('.fxAccept').forEach(b=>b.onclick=()=>decideFix(b.dataset.id,true,'',approvalsPage));
  target.querySelectorAll('.fxReject').forEach(b=>b.onclick=()=>decideFix(b.dataset.id,false,'',approvalsPage));
}

// --- Memories: what an agent has written with the `remember` action, plus
// an operator can seed one directly (fn_remember) -- see README, "Memory". ---
const memTypes=['semantic','episodic','preference','instruction','relationship','working'];
async function memoriesPage(){
  if(!state.agents.length){const d=await api('/api/v1/agents');state.agents=d.agents||[]}
  const d=await rpc('memories.list',{limit:300});state.memories=d.memories||[];
  const row=m=>`<tr><td>${esc(m.agent)}</td><td>${status(m.memory_type)}</td><td style="max-width:360px;white-space:pre-wrap">${esc(m.content)}</td><td class="mono">${esc(Number(m.importance).toFixed(2))}</td><td class="mono muted" style="font-size:11px">${esc(m.created_at)}</td><td class="mono muted" style="font-size:11px">${esc(m.expires_at||'never')}</td><td><button class="btn danger small forgetMem" data-id="${esc(m.memory_id)}">Forget</button></td></tr>`;
  $('#view').innerHTML=`<div class="panel"><h3>Search history</h3><div class="muted" style="font-size:12px;margin-bottom:10px">Search past memories, task failures, and session decisions -- everything an agent has learned, gotten wrong, or concluded -- scoped to the agents you can see. Each result links back to where it came from.</div><div class="row"><input class="input" id="histQuery" placeholder="Search…"><select class="select" id="histAgent" style="max-width:220px"><option value="">All agents</option>${state.agents.map(a=>`<option value="${esc(a.agent_id)}">${esc(a.name)}</option>`).join('')}</select><button class="btn primary" id="histGo">Search</button></div><div id="histResults" style="margin-top:12px"></div></div><div class="panel"><h3>Teach an agent something</h3><div class="grid2"><div><div class="field"><label>Agent</label><select class="select" id="memAgent">${state.agents.map(a=>`<option value="${esc(a.agent_id)}">${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Type</label><select class="select" id="memType">${memTypes.map(t=>`<option value="${esc(t)}"${t==='semantic'?' selected':''}>${esc(t)}</option>`).join('')}</select></div><div class="field"><label>Importance (0-1)</label><input class="input" id="memImportance" value="0.5"></div></div><div><div class="field"><label>Content</label><textarea class="textarea" id="memContent" placeholder="Something worth this agent recalling next time…"></textarea></div><div class="field"><label>Subject (optional)</label><input class="input" id="memSubject" placeholder="who or what this is about"></div><div class="field"><label>Expires in days (optional)</label><input class="input" id="memExpires" placeholder="blank = never"></div></div></div><button class="btn primary" id="memSave">Save</button></div><div class="panel"><h3>All memories</h3><table class="table"><thead><tr><th>Agent</th><th>Type</th><th>Content</th><th>Importance</th><th>Created</th><th>Expires</th><th></th></tr></thead><tbody>${state.memories.map(row).join('')||'<tr><td colspan="7" class="muted">No memories yet.</td></tr>'}</tbody></table></div>`;
  const runHistSearch=async()=>{
    const query=$('#histQuery').value.trim();
    if(!query){toast('Type something to search for');return}
    try{
      const r=await rpc('history.search',{query,agent_id:$('#histAgent').value,limit:50});
      const results=r.results||[];
      $('#histResults').innerHTML=results.map(x=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start"><div style="min-width:80px">${status(x.source)}</div><div style="flex:1;min-width:0"><div class="muted" style="font-size:11px">${esc(x.agent)}${x.kind?' · '+esc(x.kind):''} · ${esc(x.created_at)}</div><div style="white-space:pre-wrap;word-break:break-word">${esc(x.snippet||'')}</div></div>${(state.me?.role==='admin'&&x.session_id)?`<button class="btn small openHistSession" data-id="${esc(x.session_id)}">Open</button>`:''}</div>`).join('')||'<div class="muted">No matches.</div>';
      document.querySelectorAll('.openHistSession').forEach(b=>b.onclick=()=>threadModal(b.dataset.id));
    }catch(e){toast(e.message)}
  };
  $('#histGo').onclick=runHistSearch;
  $('#histQuery').onkeydown=e=>{if(e.key==='Enter')runHistSearch()};
  $('#memSave').onclick=async()=>{try{await rpc('memories.create',{agent_id:$('#memAgent').value,content:$('#memContent').value,memory_type:$('#memType').value,importance:$('#memImportance').value,subject_id:$('#memSubject').value,expires_in_days:$('#memExpires').value});toast('Remembered');memoriesPage()}catch(e){toast(e.message)}};
  document.querySelectorAll('.forgetMem').forEach(b=>b.onclick=async()=>{try{await rpc('memories.remove',{memory_id:b.dataset.id});toast('Forgotten');memoriesPage()}catch(e){toast(e.message)}});
}

// --- Settings: providers, dashboard access, and the SQL sandbox allowlist ---
async function settings(){
  const d=await api('/api/v1/settings');state.settings=d;
  const al=await rpc('allowlist.list').catch(()=>({allowlist:[]}));
  const conns=await rpc('connections.list').catch(()=>({connections:[]}));
  state.connections=conns.connections||[];
  const procs=await rpc('procedures.list').catch(()=>({procedures:[]}));
  state.procedures=procs.procedures||[];
  const procTools=await rpc('procedure_tools.list').catch(()=>({tools:[]}));
  state.procedureTools=procTools.tools||[];
  if(!state.agents.length){const da=await api('/api/v1/agents');state.agents=da.agents||[]}
  const scheds=await rpc('schedules.list').catch(()=>({schedules:[]}));
  state.schedules=scheds.schedules||[];
  $('#view').innerHTML=`${secretBanner(d.secret_storage)}<div class="panel"><h3>${esc(t('providersSection'))}</h3><table class="table"><thead><tr><th>Name</th><th>Kind</th><th>Purpose</th><th>Base URL</th><th>Secret</th><th>Private net</th><th>Status</th><th></th></tr></thead><tbody>${(d.providers||[]).map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.kind)}</td><td>${p.purpose==='embedding'?`embedding<div class="muted" style="font-size:11px">${esc(p.embedding_model||'')}</div>`:'chat'}</td><td class="mono">${esc(p.base_url)}</td><td>${p.has_secret?'configured':'—'}</td><td>${p.allow_private_network?'allowed':'blocked'}</td><td>${p.is_enabled?status('running'):status('disabled')}</td><td><button class="btn editProvider" data-id="${esc(p.provider_id)}">${esc(t('edit'))}</button></td></tr>`).join('')}</tbody></table><div class="row" style="margin-top:12px"><button class="btn primary" id="newProvider">Add provider</button></div></div><div class="panel"><h3>Apply provider/model to every agent</h3><div class="muted" style="font-size:12px;margin-bottom:10px">Sets llm_config.provider/model on every active agent at once (system agents included) -- a one-time write, the same as editing each agent's Provider/Model field by hand; new agents created afterward still start unconfigured, same as always.</div><div class="grid2"><div class="field"><label>Provider</label><select class="select" id="bulkProvider">${(d.providers||[]).filter(p=>p.is_enabled&&p.purpose!=='embedding').map(p=>`<option value="${esc(p.name)}">${esc(p.name)} (${esc(p.kind)})</option>`).join('')||'<option value="">No provider configured yet</option>'}</select></div><div class="field"><label>Model</label><input class="input" id="bulkModel" placeholder="e.g. gpt-4o, claude-sonnet-5, llama3"></div></div><button class="btn primary" id="bulkApply">Apply to all agents</button></div><div class="panel"><h3>API connections</h3><div class="muted" style="font-size:12px;margin-bottom:10px">A named external endpoint the <code>http_request</code> tool can call with a stored credential -- an agent supplies a relative path, never a full URL, so a connection's secret can only ever reach its own base_url. Grant an agent the <code>tool</code> permission <code>http_request</code> (and an <code>http_host</code> permission for the connection's host) before it can use one.</div><table class="table"><thead><tr><th>Name</th><th>Base URL</th><th>Auth</th><th>Secret</th><th>Private net</th><th>Status</th><th></th></tr></thead><tbody>${state.connections.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td class="mono">${esc(c.base_url)}</td><td>${esc(c.auth_kind)}</td><td>${c.has_secret?'configured':'—'}</td><td>${c.allow_private_network?'allowed':'blocked'}</td><td>${c.is_enabled?status('running'):status('disabled')}</td><td><div class="row"><button class="btn small editConn" data-id="${esc(c.connection_id)}">${esc(t('edit'))}</button><button class="btn danger small deleteConn" data-id="${esc(c.connection_id)}">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="7" class="muted">No connections yet.</td></tr>'}</tbody></table><div class="row" style="margin-top:12px"><button class="btn primary" id="newConn">Add connection</button></div></div><div class="panel"><h3>Procedures</h3><div class="muted" style="font-size:12px;margin-bottom:10px">A named, versioned, reusable "how to do X" an agent can be granted (permission type <code>procedure</code>) -- its current content is shown in every granted agent's prompt on every turn, alongside its own memory. Editing one keeps its full history; Rollback creates a new version rather than rewriting an old one.</div><table class="table"><thead><tr><th>Name</th><th>Content</th><th>Version</th><th>Status</th><th></th></tr></thead><tbody>${state.procedures.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td style="max-width:360px;white-space:pre-wrap">${esc(p.content)}</td><td class="mono">v${esc(p.generation)}</td><td>${p.is_active?status('running'):status('disabled')}</td><td><button class="btn small editProc" data-id="${esc(p.procedure_id)}">${esc(t('edit'))}</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">No procedures yet.</td></tr>'}</tbody></table><div class="row" style="margin-top:12px"><button class="btn primary" id="newProc">Add procedure</button></div></div><div class="panel"><h3>Schedules</h3><div class="muted" style="font-size:12px;margin-bottom:10px">Runs an agent against a goal on a recurring interval -- each firing starts a brand-new session (visible in Audit -&gt; Sessions), the same as sending it a message by hand. A schedule's run count/last run/last session <em>is</em> the durable record of a long-running goal, not a separate thing to track elsewhere. Firing is polled from PostgreSQL (no external cron); Run now fires immediately regardless of the interval.</div><table class="table"><thead><tr><th>Name</th><th>Agent</th><th>Goal</th><th>Every</th><th>Runs</th><th>Next / last</th><th>Status</th><th></th></tr></thead><tbody>${state.schedules.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.agent)}</td><td style="max-width:220px;white-space:pre-wrap">${esc(s.goal)}</td><td class="mono">${esc(fmtInterval(s.interval_seconds))}</td><td class="mono">${esc(s.run_count)}${s.max_runs?' / '+esc(s.max_runs):''}</td><td class="mono muted" style="font-size:11px">${s.is_active?'next '+esc(s.next_run_at):(s.last_run_at?'last '+esc(s.last_run_at):'never run')}</td><td>${s.is_active?status('running'):status('disabled')}</td><td><div class="row"><button class="btn small runSchedNow" data-id="${esc(s.schedule_id)}">Run now</button><button class="btn small editSched" data-id="${esc(s.schedule_id)}">${esc(t('edit'))}</button></div></td></tr>`).join('')||'<tr><td colspan="8" class="muted">No schedules yet.</td></tr>'}</tbody></table><div class="row" style="margin-top:12px"><button class="btn primary" id="newSched">Add schedule</button></div></div><div class="panel"><h3>${esc(t('sandboxSection'))}</h3><div cla  class="btn small langBtn${lang()==='ko'?' primary':''}" data-lang="ko">한국어</button></div><div class="row wrap" style="margin-top:10px"><span class="muted" style="min-width:90px">${esc(t('theme'))}</span><button class="btn small themeBtn${(theme()||'dark')==='dark'?' primary':''}" data-theme="dark">${esc(t('dark'))}</button><button class="btn small themeBtn${theme()==='light'?' primary':''}" data-theme="light">${esc(t('light'))}</button></div></div><div class="panel"><h3>${esc(t('usersSection'))}</h3><div id="usersSection"></div></div>`;

function providerModal(p){
  const isOauth=p.kind==='oauth';
  const isDeviceOauth=isOauth&&p.oauth_flow==='device_code';
  const isEmbedding=p.purpose==='embedding';
  const oauthFields=isOauth?`<div class="field"><label>OAuth flow</label><div class="muted">${isDeviceOauth?'device code (browser account login)':'authorization code'}</div></div>${isDeviceOauth?`<div class="field"><label>Device authorization URL</label><input class="input" id="pDeviceUrl" value="${esc(p.oauth_device_url||'')}" disabled></div>`:`<div class="field"><label>Authorization URL</label><input class="input" id="pAuthUrl" value="${esc(p.oauth_auth_url||'')}"></div>`}<div class="field"><label>Token URL</label><input class="input" id="pTokenUrl" value="${esc(p.oauth_token_url||'')}"></div><div class="field"><label>Client ID</label><input class="input" id="pClientId" value="${esc(p.oauth_client_id||'')}"></div>${isDeviceOauth?'':'<div class="field"><label>Client secret (leave blank to keep existing)</label><input type="password" class="input" id="pClientSecret" autocomplete="new-password"></div>'}`:'';
  const connectRow=isOauth?`<div style="margin:14px 0"><div class="row"><button class="btn" id="connectOauth">${isDeviceOauth?'Connect with xAI':'Connect via OAuth'}</button><span class="spacer"></span><span class="muted" style="font-size:12px">${p.oauth_connected?'Connected. Token refresh is automatic.':p.has_secret?'A token is stored for this provider.':'Not connected yet.'}</span></div><div id="oauthDeviceStatus" class="muted" style="font-size:13px;margin-top:10px"></div></div>`:'';
  const embedField=isEmbedding?`<div class="field"><label>Embedding model</label><input class="input" id="pEmbedModel" value="${esc(p.embedding_model||'')}"></div>`:'';
  const jsonModeField=isOauth?'':`<div class="field"><label><input type="checkbox" id="pJsonMode" ${p.response_format_json_object!==false?'checked':''}> Send OpenAI response_format</label><div class="muted" style="font-size:12px">Most servers accept it and it improves reply quality. Uncheck for a local server that rejects it outright (confirmed live against LM Studio: HTTP 400, "response_format.type must be 'json_schema' or 'text'"); already off for the seeded Ollama provider.</div></div>`;
  $('#modal').classList.remove('hidden');$('#modal').innerHTML=`<div class="dialog"><div class="row"><h3>${esc(p.name)}</h3><span class="spacer"></span><button class="btn" id="closeM">Close</button></div><div class="field"><label>Purpose</label><div class="muted" style="font-size:12px">${isEmbedding?'embedding -- powers search_agents only':'chat -- serves an agent\'s own turns'} (set at creation, cannot be changed here)</div></div>${embedField}<div class="field"><label>Base URL</label><input class="input" id="pUrl" value="${esc(p.base_url)}"></div>${isOauth?'':'<div class="field"><label>API key (leave blank to keep existing)</label><input type="password" class="input" id="pKey" autocomplete="new-password"></div>'}${oauthFields}<div class="field"><label><input type="checkbox" id="pEnabled" ${p.is_enabled?'checked':''}> Enabled</label></div><div class="field"><label><input type="checkbox" id="pPrivate" ${p.allow_private_network?'checked':''}> Allow loopback / private-network endpoint</label><div class="muted" style="font-size:12px">Needed for a local Ollama or an in-cluster gateway. Leaving this off is what stops this endpoint from being pointed at an internal address.</div></div>${jsonModeField}${connectRow}<button class="btn primary" id="saveP">Save</button></div>`;
  $('#closeM').onclick=closeModal;
  $('#saveP').onclick=async()=>{try{const body={provider_id:p.provider_id,base_url:$('#pUrl').value,is_enabled:$('#pEnabled').checked,allow_private_network:$('#pPrivate').checked,operator_name:opName(),session_token:sessTok()};if(!isOauth)body.response_format_json_object=$('#pJsonMode').checked;if(isOauth){if(!isDeviceOauth)body.oauth_auth_url=$('#pAuthUrl').value;body.oauth_token_url=$('#pTokenUrl').value;body.oauth_client_id=$('#pClientId').value;if(!isDeviceOauth)body.oauth_client_secret=$('#pClientSecret').value}else{body.api_key=$('#pKey').value}if(isEmbedding)body.embedding_model=$('#pEmbedModel').value;await api('/api/v1/settings/provider',{method:'POST',body:JSON.stringify(body)});closeModal();toast('Provider saved');settings()}catch(e){toast(e.message)}};
  // Full-page redirect to the provider's own login page, same as any other
  // OAuth "Connect" button -- the provider redirects back to this same
  // dashboard URL with ?code=&state=, which the boot-time handler below
  // (oauthCallbackOnLoad) picks up and completes via providers.oauth_callback.
  if(isOauth)$('#connectOauth').onclick=async()=>{try{
    if(!isDeviceOauth){const redirect=location.origin+location.pathname;const r=await rpc('providers.oauth_start',{provider_id:p.provider_id,redirect});if(r.redirect_url)location.href=r.redirect_url;return}
    const started=await rpc('providers.oauth_device_start',{provider_id:p.provider_id});
    const target=$('#oauthDeviceStatus');target.textContent='Requesting a device code…';
    const poll=async()=>{try{const s=await rpc('providers.oauth_device_status',{session_id:started.session_id});if(!$('#oauthDeviceStatus'))return;
      if(s.status==='awaiting_user'){const rawUrl=s.verification_uri_complete||s.verification_uri;let url='';try{const parsed=new URL(rawUrl);if(parsed.protocol==='https:')url=parsed.href}catch(_){}
        if(url)target.innerHTML=`Open <a href="${esc(url)}" target="_blank" rel="noopener">xAI login</a> and enter code <strong class="mono">${esc(s.user_code||'')}</strong>. Waiting for approval…`;
        else target.textContent=`Enter code ${s.user_code||''} on the xAI device login page. Waiting for approval…`;
        setTimeout(poll,2000);return}
      if(s.status==='starting'){target.textContent='Requesting a device code…';setTimeout(poll,1000);return}
      if(s.status==='connected'){target.textContent='Connected. OAuth tokens will refresh automatically.';toast('xAI account connected');setTimeout(()=>{closeModal();settings()},800);return}
      target.textContent=`OAuth ${s.status}: ${s.error||'login did not complete'}`
    }catch(e){target.textContent=e.message}};poll()
  }catch(e){toast(e.message)}};
}

// --- Schedules (roadmap item 6): fire an agent against a goal on a
// recurring interval, polled from PostgreSQL (fn_run_schedules via
// fn_pump) -- see that table's own comment in control_plane.sql. A
// schedule's run_count/last_run_at/last_session_id is itself the durable
// record of a long-running goal, so the edit modal surfaces those instead
// of hiding them behind a separate history view. ---
function scheduleModal(s){
  const endsVal=s.ends_at?new Date(s.ends_at).toISOString().slice(0,16):'';
  $('#modal').classList.remove('hidden');$('#modal').innerHTML=`<div class="dialog"><div class="row"><h3>${esc(s.name)}</h3><span class="spacer"></span><button class="btn" id="closeM">Close</button></div><div class="field"><label>Agent</label><div class="muted" style="font-size:12px">${esc(s.agent)} (set at creation, cannot be changed here)</div></div><div class="field"><label>Goal (sent as a new message each run)</label><textarea class="textarea" id="scGoal" style="min-height:80px">${esc(s.goal)}</textarea></div><div class="grid2"><div class="field"><label>Every (seconds)</label><input class="input" id="scInterval" value="${esc(s.interval_seconds)}"></div><div class="field"><label>Max runs (optional)</label><input class="input" id="scMaxRuns" value="${s.max_runs?esc(s.max_runs):''}" placeholder="unlimited"></div></div><div class="field"><label>Ends at (optional)</label><input type="datetime-local" class="input" id="scEndsAt" value="${endsVal}"></div><div class="field"><label><input type="checkbox" id="scEnabled" ${s.is_active?'checked':''}> Enabled</label></div><div class="muted" style="font-size:12px;margin-bottom:10px">Run ${esc(s.run_count)}${s.max_runs?' of '+esc(s.max_runs):''}. ${s.last_run_at?'Last ran '+esc(s.last_run_at)+'.':'Never run yet.'} ${s.is_active?'Next due '+esc(s.next_run_at)+'.':''}</div><div class="row"><button class="btn primary" id="saveSched">Save</button><button class="btn" id="runSchedNowM">Run now</button><span class="spacer"></span><button class="btn danger" id="deleteSched">Delete</button></div></div>`;
  $('#closeM').onclick=closeModal;
  $('#saveSched').onclick=async()=>{
    try{
      const body={schedule_id:s.schedule_id,goal:$('#scGoal').value,interval_seconds:$('#scInterval').value,is_active:$('#scEnabled').checked};
      const maxRuns=$('#scMaxRuns').value.trim();
      if(maxRuns)body.max_runs=maxRuns;else body.clear_max_runs=true;
      const endsAt=$('#scEndsAt').value;
      if(endsAt)body.ends_at=new Date(endsAt).toISOString();else body.clear_ends_at=true;
      await rpc('schedules.update',body);closeModal();toast('Schedule saved');settings()
    }catch(e){toast(e.message)}
  };
  $('#runSchedNowM').onclick=async()=>{try{await rpc('schedules.run_now',{schedule_id:s.schedule_id});closeModal();toast('Fired');settings()}catch(e){toast(e.message)}};
  $('#deleteSched').onclick=async()=>{if(!confirm('Delete this schedule? Sessions it already created are unaffected.'))return;try{await rpc('schedules.delete',{schedule_id:s.schedule_id});closeModal();toast('Deleted');settings()}catch(e){toast(e.message)}};
}

// --- Users (item 45: folded into Settings, admin-only): real accounts,
// roles, and per-user agent assignment -- see README, "Model configuration
// and conversations". ---
async function usersPage(target){
  target=target||$('#view');
  const d=await rpc('users.list'); state.users=d.users||[];
  if(!state.agents.length){const da=await api('/api/v1/agents');state.agents=da.agents||[]}
  target.innerHTML=`<div class="panel"><h3>Create user</h3><div class="grid2"><div class="field"><label>Username</label><input class="input" id="nuUser"></div><div class="field"><label>Password</label><input type="password" class="input" id="nuPass" autocomplete="new-password"></div></div><div class="field"><label>Role</label><select class="select" id="nuRole"><option value="user">user</option><option value="admin">admin</option></select></div><button class="btn primary" id="nuGo">${esc(t('create'))}</button></div>
<div class="panel"><table class="table"><thead><tr><th>Username</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>${state.users.map(u=>`<tr><td><b>${esc(u.username)}</b></td><td>${esc(u.role)}</td><td>${u.is_active?status('running'):status('disabled')}</td><td><div class="row"><button class="btn small manageAssign" data-id="${esc(u.user_id)}">Agents</button><button class="btn small toggleActive" data-id="${esc(u.user_id)}" data-active="${u.is_active}">${u.is_active?'Deactivate':'Activate'}</button><button class="btn small toggleRole" data-id="${esc(u.user_id)}" data-role="${esc(u.role)}">Make ${u.role==='admin'?'user':'admin'}</button></div></td></tr>`).join('')||`<tr><td colspan="4" class="muted">${esc(t('noData'))}</td></tr>`}</tbody></table></div>`;
  target.querySelector('#nuGo').onclick=async()=>{try{await rpc('users.create',{username:target.querySelector('#nuUser').value,password:target.querySelector('#nuPass').value,role:target.querySelector('#nuRole').value});toast('Created');usersPage(target)}catch(e){toast(e.message)}};
  target.querySelectorAll('.toggleActive').forEach(b=>b.onclick=async()=>{try{await rpc('users.set_active',{user_id:b.dataset.id,is_active:b.dataset.active!=='true'});usersPage(target)}catch(e){toast(e.message)}});
  target.querySelectorAll('.toggleRole').forEach(b=>b.onclick=async()=>{try{await rpc('users.set_role',{user_id:b.dataset.id,role:b.dataset.role==='admin'?'user':'admin'});usersPage(target)}catch(e){toast(e.message)}});

function assignmentsModal(userId){
  rpc('assignments.list',{user_id:userId}).then(d=>{
    const assigned=new Set(d.agent_ids||[]);
    $('#modal').classList.remove('hidden');
    $('#modal').innerHTML=`<div class="dialog"><div class="row"><h3>Assigned agents</h3><span class="spacer"></span><button class="btn" id="closeM">Close</button></div>${state.agents.length?state.agents.map(a=>`<div class="field"><label><input type="checkbox" class="assignChk" value="${esc(a.agent_id)}" ${assigned.has(a.agent_id)?'checked':''}> ${esc(a.name)}</label></div>`).join(''):'<div class="muted">No agents exist yet.</div>'}<button class="btn primary" id="saveAssign">Save</button></div>`;
    $('#closeM').onclick=closeModal;

      const ids=[...document.querySelectorAll('.assignChk:checked')].map(c=>c.value);
      try{await rpc('assignments.set',{user_id:userId,agent_ids:ids});closeModal();toast('Saved')}catch(e){toast(e.message)}

// --- Chat (item 43): General (plain 1:1), Messenger (Slack-style shared
// channel), and Project (a preset system prompt + agent, item 42) as three
// modes of one page, switched with buttons instead of three separate nav
// entries. ---
async function chatPage(){
  const modes=[['general','general'],['messenger','messenger'],['project','project']];
  $('#view').innerHTML=`<div class="row" style="margin-bottom:14px">${modes.map(([m,k])=>`<button class="btn small chatModeBtn${state.chatMode===m?' primary':''}" data-mode="${m}">${esc(t(k))}</button>`).join('')}</div><div id="chatModeBody"></div>`;
  document.querySelectorAll('.chatModeBtn').forEach(b=>b.onclick=()=>{state.chatMode=b.dataset.mode;chatPage()});
  const body=$('#chatModeBody');
  if(state.chatMode==='messenger')await messengerPage(body);
  else if(state.chatMode==='project')await projectChatMode(body);
  else await generalChatMode(body);
}
// General mode: no agent picker -- always the seeded 'general' agent (a
// plain conversational partner, no view/tool permissions), so this is just
// "type and talk" rather than "pick an agent, then talk." Still
// fn_chat_send/fn_chat_history underneath, one ongoing session per (user,
// 'general') pair, same as any other agent in this same mode used to be.
// An admin reaches 'general' the same way it reaches every other agent
// here (agents.mine bypasses the assignment check for admin); a regular
// user needs it explicitly assigned, same as any other agent -- if it
// isn't, this degrades to the same "ask an admin" message an unassigned
// user already saw before this change.
async function generalChatMode(target){
  target=target||$('#view');
  const d=await rpc('agents.mine'); state.myAgents=d.agents||[];
  const general=state.myAgents.find(a=>a.name==='general');
  state.chatAgentId=general?general.agent_id:null;
  target.innerHTML=`<div class="panel"><div id="chatThread" style="max-height:55vh;overflow:auto;margin-bottom:14px"></div><div class="row"><input class="input" id="chatInput" placeholder="Message…" ${general?'':'disabled'}><button class="btn primary" id="chatSend" ${general?'':'disabled'}>${esc(t('send'))}</button></div></div>`;
  $('#chatSend').onclick=sendChat;
  $('#chatInput').onkeydown=e=>{if(e.key==='Enter')sendChat()};
  await renderChatThread();
}
// Project mode: same shape as General, but keyed by project (its own
// continuing session -- see user_project_chat_sessions) and against
// whichever agent that project is bound to, with its preset_prompt
// applied server-side (fn_next_step).
async function projectChatMode(target){
  target=target||$('#view');
  const pd=await rpc('projects.list').catch(()=>({projects:[]}));
  const opts_=(pd.projects||[]).filter(p=>p.is_active&&p.agent_id);
  if((!state.chatProjectId||!opts_.some(p=>p.project_id===state.chatProjectId))&&opts_.length)
    state.chatProjectId=opts_[0].project_id;
  const opts=opts_.map(p=>`<option value="${esc(p.project_id)}" ${p.project_id===state.chatProjectId?'selected':''}>${esc(p.name)} (${esc(p.agent)})</option>`).join('');
  target.innerHTML=`<div class="panel"><div class="row" style="margin-bottom:14px"><label class="muted" style="font-size:12px">Project</label><select class="select" id="chatProjectSel" style="max-width:300px">${opts||'<option value="">No project configured for chat yet</option>'}</select></div><div id="projectChatThread" style="max-height:55vh;overflow:auto;margin-bottom:14px"></div><div class="row"><input class="input" id="projectChatInput" placeholder="Message…" ${opts_.length?'':'disabled'}><button class="btn primary" id="projectChatSend" ${opts_.length?'':'disabled'}>${esc(t('send'))}</button></div></div>`;
  $('#chatProjectSel').onchange=()=>{state.chatProjectId=$('#chatProjectSel').value;renderProjectChatThread()};
  $('#projectChatSend').onclick=sendProjectChat;
  $('#projectChatInput').onkeydown=e=>{if(e.key==='Enter')sendProjectChat()};
  await renderProjectChatThread();
}
async function renderProjectChatThread(){
  if(!$('#projectChatThread'))return;
  if(!state.chatProjectId){$('#projectChatThread').innerHTML=`<div class="muted">${esc(t('noData'))}</div>`;return}
  try{ const h=await rpc('project_chat.history',{project_id:state.chatProjectId});
    if(!$('#projectChatThread'))return;
    $('#projectChatThread').innerHTML=(h.messages||[]).map(m=>msgBubble(m)).join('')||'<div class="muted">Say hello.</div>';
  }catch(e){if($('#projectChatThread'))$('#projectChatThread').innerHTML=`<div class="muted">${esc(e.message)}</div>`}
}
let projectChatPollTimer=null;
async function sendProjectChat(){
  if(!state.chatProjectId)return;
  const v=$('#projectChatInput').value.trim(); if(!v)return;
  $('#projectChatInput').value='';
  try{
    await rpc('project_chat.send',{project_id:state.chatProjectId,message:v});
    await renderProjectChatThread();
    if(projectChatPollTimer)clearInterval(projectChatPollTimer);
    let tries=0;
    projectChatPollTimer=setInterval(async()=>{tries++;await renderProjectChatThread();if(tries>=10)clearInterval(projectChatPollTimer)},1500);
  }catch(e){toast(e.message)}
}
async function renderChatThread(){
  // A stray poll tick (loadPage clears the timer, but a call already in
  // flight can still land after navigating away) must not throw on a
  // #chatThread that no longer exists.
  if(!$('#chatThread'))return;
  if(!state.chatAgentId){$('#chatThread').innerHTML='<div class="muted">The \'general\' agent is not assigned to you yet -- ask an admin.</div>';return}
  try{ const h=await rpc('chat.history',{agent_id:state.chatAgentId});
    if(!$('#chatThread'))return;
    $('#chatThread').innerHTML=(h.messages||[]).map(m=>msgBubble(m)).join('')||'<div class="muted">Say hello.</div>';
  }catch(e){if($('#chatThread'))$('#chatThread').innerHTML=`<div class="muted">${esc(e.message)}</div>`}
}
let chatPollTimer=null;
async function sendChat(){
  if(!state.chatAgentId)return;
  const v=$('#chatInput').value.trim(); if(!v)return;
  $('#chatInput').value='';
  try{
    await rpc('chat.send',{agent_id:state.chatAgentId,message:v});
    await renderChatThread();
    if(chatPollTimer)clearInterval(chatPollTimer);
    let tries=0;
    chatPollTimer=setInterval(async()=>{tries++;await renderChatThread();if(tries>=10)clearInterval(chatPollTimer)},1500);
  }catch(e){toast(e.message)}
}

// --- Messenger: the Slack-style shared channel. A plain post is just
// stored; "@agent_name" additionally routes the message to that agent
// (fn_messenger_post), sharing the same session chat.send/chat.history use
// for that (user, agent) pair -- not a second, divergent conversation. ---
async function messengerPage(target){
  target=target||$('#view');
  target.innerHTML=`<div class="panel"><div id="msgFeed" style="max-height:60vh;overflow:auto;margin-bottom:14px"></div><div class="row"><input class="input" id="msgInput" placeholder="Message… use @agent_name to address an agent, or several"><button class="btn primary" id="msgSend">${esc(t('send'))}</button></div></div>`;
  $('#msgSend').onclick=sendMessenger;
  $('#msgInput').onkeydown=e=>{if(e.key==='Enter')sendMessenger()};
  await renderMessengerFeed();
}
async function renderMessengerFeed(){
  const d=await rpc('messenger.list',{limit:200});
  // Same stray-poll-tick guard as renderChatThread: a call already in
  // flight can still land after navigating away from Messenger.
  if(!$('#msgFeed'))return;
  const oneReply=(agent,st,reply)=>{
    const body=st==='completed'?esc(reply||''):st==='failed'?'(agent failed to respond)':'(waiting for reply…)';
    return `<div class="msg-body mono" style="color:var(--accent2)">${agent?`<b>${esc(agent)}:</b> `:''}${body}</div>`;
  };
  // A multi-mention post (item 40) shows every mentioned agent's own reply,
  // not just the first -- mentioned_agents is only present for those.
  const replyLine=m=>{
    if(Array.isArray(m.mentioned_agents)&&m.mentioned_agents.length)
      return m.mentioned_agents.map(x=>oneReply(x.agent,x.reply_status,x.reply)).join('');
    if(!m.mentioned_agent)return '';
    return oneReply(null,m.reply_status,m.reply);
  };
  $('#msgFeed').innerHTML=(d.messages||[]).map(m=>`<div class="msg"><div class="row"><b>${esc(m.author)}</b>${m.mentioned_agent?`<span class="mono muted" style="font-size:11px">@${esc(m.mentioned_agent)}</span>`:''}<span class="spacer"></span><span class="mono muted" style="font-size:11px">${esc(m.created_at)}</span></div><div class="msg-body">${esc(m.content)}</div>${replyLine(m)}</div>`).join('')||'<div class="muted">No messages yet.</div>';
}
let msgPollTimer=null;
async function sendMessenger(){
  const v=$('#msgInput').value.trim(); if(!v)return;
  $('#msgInput').value='';
  try{
    await rpc('messenger.post',{text:v});
    await renderMessengerFeed();
    if(msgPollTimer)clearInterval(msgPollTimer);
    let tries=0;
    msgPollTimer=setInterval(async()=>{tries++;await renderMessengerFeed();if(tries>=10)clearInterval(msgPollTimer)},1500);
  }catch(e){toast(e.message)}
}

// The event stream authenticates with a short-lived, single-use ticket
// (POST /api/v1/events/ticket, gated by the real bearer token) instead of
// carrying the durable dashboard token in the URL -- EventSource cannot set
// headers, so something has to go in the query string, and this keeps it
// out of proxy access logs, browser history, and the Referrer header. The
// server closes the stream every ~30s on purpose (see stream_events in
// src/lib.rs) and does not send a `retry:` field, so reconnection is driven
// from here: mint a fresh ticket and open a new EventSource on every error,
// rather than relying on the browser's native retry-with-the-same-URL,
// which a single-use ticket cannot satisfy.
let esRetryTimer=null;
async function startEvents(){
  if(esRetryTimer){clearTimeout(esRetryTimer);esRetryTimer=null}
  let url='/api/v1/events';
  try{
    const t=await api('/api/v1/events/ticket',{method:'POST'});
    if(t.ticket)url+='?ticket='+encodeURIComponent(t.ticket)
  }catch(e){
    $('#health').textContent='reconnecting';
    esRetryTimer=setTimeout(startEvents,2000);
    return;
  }
  const es=new EventSource(url);
  es.addEventListener('snapshot',e=>{try{const d=JSON.parse(e.data);$('#health').textContent='workers online';const live=$('#live');if(live&&d.tasks){live.innerHTML=d.tasks.slice(0,8).map(t=>`<div class="row" style="padding:5px 0"><span>${esc(t.agent)}</span><span>${status(t.status)}</span><span class="mono muted">step ${esc(t.step_count)}</span></div>`).join('')||'No activity'} }catch{}});
  es.onerror=()=>{$('#health').textContent='reconnecting';es.close();esRetryTimer=setTimeout(startEvents,1500)};
}
// If the page just loaded from a provider's OAuth redirect (?code=&state=),
// complete the flow before anything else renders. The redirect_uri
// registered with the provider is this dashboard's own URL, so this is the
// only place a code/state pair can arrive -- there is no separate callback
// route. providers.oauth_callback only ever queues the exchange (see
// KNOWN_ISSUES.md, "a second-round external review of items 18 and 19"), so
// nothing secret ever reaches this page: the runtime worker performs the
// real token exchange in the background and settings.get's has_secret is
// how a later Settings load finds out it landed.
async function oauthCallbackOnLoad(){
  const qs=new URLSearchParams(location.search);
  const oauthCode=qs.get('code'), oauthState=qs.get('state');
  if(!oauthCode||!oauthState)return;
  history.replaceState({}, '', location.pathname);
  try{
    await rpc('providers.oauth_callback',{code:oauthCode,state:oauthState,redirect:location.origin+location.pathname});
    toast('OAuth exchange queued -- check back in a moment for the connected status.');
  }catch(e){toast('OAuth callback failed: '+e.message)}
  state.page='Settings';
}
// A real per-user login gate in front of the whole app -- separate from,
// and on top of, the dashboard token above: that token still decides
// whether a browser reaches the HTTP surface at all; this decides, once it
// has, who is using it and which pages/agents they may reach (see README,
// "Model configuration and conversations").
function renderLogin(err){
  $('.app').classList.add('hidden');
  $('#modal').classList.remove('hidden');
  $('#modal').innerHTML=`<div class="dialog" style="max-width:360px"><h3>${esc(t('signIn'))}</h3><div class="field"><label>${esc(t('username'))}</label><input class="input" id="liUser"></div><div class="field"><label>${esc(t('password'))}</label><input type="password" class="input" id="liPass"></div><button class="btn primary" id="liGo">${esc(t('signIn'))}</button>${err?`<div class="muted" style="font-size:12px;margin-top:10px;color:var(--bad)">${esc(err)}</div>`:''}</div>`;
  const go=async()=>{
    try{
      const r=await rpc('auth.login',{username:$('#liUser').value,password:$('#liPass').value});
      setSessTok(r.session_token);
      state.me={user_id:r.user_id,username:r.username,role:r.role};
      state.page=pagesForRole()[0];
      $('#modal').classList.add('hidden');$('#modal').innerHTML='';
      $('.app').classList.remove('hidden');
      await boot(true);
    }catch(e){renderLogin(e.message)}
  };
  $('#liGo').onclick=go;
  $('#liPass').onkeydown=e=>{if(e.key==='Enter')go()};
}
$('#logoutBtn').onclick=async()=>{
  try{await rpc('auth.logout')}catch{}
  setSessTok('');state.me=null;
  location.reload();
};
async function boot(skipOauth){
  let me;
  try{ me=await rpc('auth.me') }catch(e){ me={logged_in:false} }
  if(!me.logged_in){ setSessTok(''); state.me=null; renderLogin(); return }
  state.me={user_id:me.user_id,username:me.username,role:me.role};
  if(!skipOauth) await oauthCallbackOnLoad();
  nav();loadPage();startEvents();
}
boot();
</script></body></html>
